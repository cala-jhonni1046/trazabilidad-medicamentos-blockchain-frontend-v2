  /* Registro de empresa (RF-AUT-02) */
  async registrarEmpresa(d,f){
    const tipo=f.get('tipo'), razon=f.get('razon').trim(), cuit=f.get('cuit').trim(), gln=soloDig(f.get('gln')), provincia=f.get('provincia');
    if(!cuitValido(cuit)) return err('CUIT inválido','El dígito verificador no coincide (módulo 11). Revisá el número.');
    if(empCuit(cuit)) return err('Ya existe una empresa con ese CUIT','');
    if(gln.length!==13||!gs1Valido(gln)) return err('GLN inválido','Tiene que tener 13 dígitos y un dígito verificador GS1 válido.');
    const file=f.get('pdf'); let bytes, nombre;
    if(file && file.size){
      if(file.type!=='application/pdf') return err('El archivo tiene que ser un PDF','');
      if(file.size>5*1024*1024) return err('El PDF supera los 5 MB','');
      bytes=await file.arrayBuffer(); nombre=file.name;
    } else { bytes=`%PDF-1.4 · ${f.get('hab')} · ${razon} · CUIT ${cuit}`; nombre='habilitacion-ejemplo.pdf'; }
    const id='emp-'+(S.empresas.length+1), uid='u-'+id, d10=soloDig(cuit);
    const e={id,tipo,razon,cuit:`${d10.slice(0,2)}-${d10.slice(2,10)}-${d10[10]}`,gln,provincia,localidad:f.get('localidad').trim(),habilitacion:f.get('hab').trim(),dt:f.get('dt').trim(),solicitud:nowISO(),estado:'PENDIENTE',inspectorId:null,habilitadaPor:null,fechaHab:null,docNombre:nombre};
    e.docHash=await sha(bytes); S.docs[id]=bytes;
    S.empresas.push(e);
    S.usuarios.push({id:uid,rol:tipo,nombre:f.get('admin').trim(),empresaId:id,admin:true,dt:f.get('admin').trim()===e.dt.replace(/ \(.*\)/,'')});
    registrar('SOLICITUD_HABILITACION',uid,{empresa:id},`${razon} · ${TIPO_EMP[tipo]} · CUIT ${e.cuit} · ${provincia}`,{docHash:e.docHash});
    const n=inspectoresActivos(provincia).length;
    flash('ok',`Solicitud de ${razon} enviada`, n ? `Quedó en la bandeja de los ${n} inspector${n>1?'es':''} de ${provincia}. El hash del PDF (${short(e.docHash)}) quedó en la cadena. Ya podés ingresar con su usuario: verás que está en revisión.`
      : `${provincia} no tiene inspectores: la solicitud llegó a la bandeja de la Sede Central, que la va a asignar.`);
    S.ui.loginTab='ingresar'; await commit();
  },

  /* Sede Central */
  async altaIns(d,f){
    const nombre=f.get('nombre').trim(), dni=soloDig(f.get('dni')), legajo=f.get('legajo').trim().toUpperCase(), provincia=f.get('provincia');
    if(dni.length<7||dni.length>8) return err('DNI inválido','Tiene que tener 7 u 8 dígitos.');
    if(S.inspectores.some(i=>i.dni===dni||i.legajo===legajo)) return err('Ya existe un inspector con ese DNI o legajo','');
    const id='ins-'+(S.inspectores.length+1);
    S.inspectores.push({id,nombre,dni,legajo,provincia,estado:'ACTIVO',altaPor:user().id,fechaAlta:nowISO()});
    S.usuarios.push({id:'u-'+id,rol:'INSPECTOR',nombre,inspectorId:id});
    registrar('ALTA_INSPECTOR',user().id,{inspector:id},`${nombre} (${legajo}) · ${provincia}`);
    flash('ok',`${nombre} quedó dado de alta como inspector de ${provincia}`,'Desde ahora ve la bandeja de su provincia.'); await commit();
  },

  /* Lotes y bultos */
  async crearLote(d,f){
    const u=user(), m=med(f.get('medId')), cant=parseInt(f.get('cantidad'),10), fab=f.get('fab'), venc=f.get('venc');
    if(!m||m.labId!==u.empresaId) return err('Ese medicamento no es de tu laboratorio','');
    if(!(cant>=1&&cant<=1000)) return err('Cantidad fuera de rango','En el prototipo un lote va de 1 a 1.000 cajas.');
    if(!fab||!venc||venc<=fab) return err('El vencimiento tiene que ser posterior a la fabricación','');
    if(new Date(venc+'T23:59')<HOY) return err('No se puede registrar un lote vencido','R10');
    const max=Math.max(...S.lotes.map(l=>+l.codigo.slice(-4))), num=p4(max+1), id='lot-'+(S.lotes.length+1), codigo='L'+fab.slice(0,4)+'-'+num;
    S.lotes.push({id,codigo,medId:m.id,labId:u.empresaId,cantidad:cant,fab,venc,estado:'PENDIENTE_LIBERACION',estadoPrevio:null,liberadoPor:null,fechaLib:null,creado:nowISO()});
    for(let i=1;i<=cant;i++) S.unidades.push({serie:num+'S'+p6(i),loteId:id,bultoId:null,empresaId:u.empresaId,estado:'EN_LABORATORIO'});
    registrar('LOTE_REGISTRADO',u.id,{lote:id},`${codigo} · ${m.nombre} · ${fmtN(cant)} cajas · series ${num}S000001 a ${num}S${p6(cant)}`);
    flash('ok',`Registraste el lote ${codigo}`,`Se generaron ${fmtN(cant)} series únicas. Queda pendiente de liberación ${m.biologico?'por ANMAT (biológico)':'por tu director técnico'} (R4).`); await commit();
  },
  async liberarDT(d){
    const u=user(), l=lote(d.id); if(!u.dt||l.labId!==u.empresaId||l.estado!=='PENDIENTE_LIBERACION') return;
    if(med(l.medId).biologico) return err('No podés liberar este lote','R4: los biológicos los libera un inspector de ANMAT.');
    if(vencido(l)) return err('No se puede liberar','El lote está vencido.');
    l.estado='LIBERADO'; l.liberadoPor=u.id; l.fechaLib=nowISO(); S.ui.loteSel=l.id;
    registrar('LOTE_LIBERADO',u.id,{lote:l.id},`${l.codigo} liberado por el director técnico`);
    flash('ok',`Liberaste ${l.codigo}`,'Ahora podés armar sus bultos.'); await commit();
  },
  async liberar(d){
    const l=lote(d.id), i=insDe(user()); if(l.estado!=='PENDIENTE_LIBERACION') return;
    if(!med(l.medId).biologico) return err('Este lote lo libera el laboratorio','R4');
    if(emp(l.labId).provincia!==i.provincia) return err('No es de tu provincia','R4: lo libera un inspector de la provincia del laboratorio.');
    l.estado='LIBERADO'; l.liberadoPor=i.id; l.fechaLib=nowISO();
    registrar('LOTE_LIBERADO',user().id,{lote:l.id},`${l.codigo} liberado por ANMAT (biológico)`);
    flash('ok',`Liberaste ${l.codigo}`,'Queda firmado con tu legajo. El laboratorio ya puede armar bultos.'); await commit();
  },
  elegirLote(d){ S.ui.loteSel=d.id; render(); },
  async armarBultos(d,f){
    const u=user(), l=lote(d.lote), c=cir(f.get('circuito')), n=parseInt(f.get('n'),10), k=parseInt(f.get('k'),10);
    if(l.estado!=='LIBERADO') return err('El lote no está liberado','R6');
    const bl=bloqueoLote(l); if(bl) return err('No se pueden armar bultos',bl);
    if(!c||c.estado!=='APROBADO'||c.labId!==u.empresaId) return err('El circuito no está aprobado','R6');
    const libres=S.unidades.filter(x=>x.loteId===l.id&&!x.bultoId);
    if(!(n>=1&&k>=1)||n*k>libres.length) return err('No alcanzan las cajas',`Pediste ${n} × ${k} = ${n*k} cajas y quedan ${libres.length} sin bulto.`);
    const out=[];
    for(let j=0;j<n;j++){
      const nb=S.bultos.length+1, b={id:'b-'+nb,codigo:'BUL-'+p4(nb),loteId:l.id,circuitoId:c.id,cantidad:k,precinto:'PR-'+(48210+nb),estado:'ARMADO',ubicacionId:u.empresaId,despachoId:null,viajes:[],armado:nowISO()};
      libres.slice(j*k,(j+1)*k).forEach(x=>x.bultoId=b.id); S.bultos.push(b); out.push(b);
    }
    registrar('BULTO_ARMADO',u.id,{lote:l.id,bultos:out.map(b=>b.id)},`${n} bulto${n>1?'s':''} de ${k} cajas del lote ${l.codigo}: ${out.map(b=>b.codigo).join(', ')} → ${nombreEmp(c.farmId)} (${c.codigo})`);
    flash('ok',`Armaste ${out.map(b=>b.codigo).join(', ')}`,`Ya podés despacharlos en Viajes · tramo 1. Destino: ${nombreEmp(c.farmId)}, vía ${nombreEmp(c.distId)}`); await commit();
  },

  /* Viajes (R7, R9, R14) */
  async crearViaje(d,f){
    const u=user(), tramo=u.rol==='LABORATORIO'?1:2, ids=f.getAll('bultos');
    if(!ids.length) return aviso('Elegí al menos un bulto','');
    for(const id of ids){ const b=bul(id), bl=bloqueoBulto(b); if(bl) return err(`${b.codigo} no puede viajar`,bl+' (R10)'); if(b.despachoId) return err(`${b.codigo} ya está en otro viaje`,''); }
    const nv=S.viajes.length+1, v={id:'v-'+nv,codigo:'VJ-'+p4(nv),tramo,origenId:u.empresaId,creadoPor:u.id,patente:f.get('patente').trim().toUpperCase(),chofer:f.get('chofer').trim(),creado:nowISO(),salida:null,estimada:f.get('estimada')?f.get('estimada')+':00':null,estado:'PROGRAMADO',bultoIds:ids};
    S.viajes.push(v); ids.forEach(id=>{const b=bul(id); b.despachoId=v.id; b.viajes.push(v.id);});
    const par=paradas(v).map(nombreEmp);

    flash('ok',`Creaste ${v.codigo} con ${ids.length} bulto${ids.length>1?'s':''}`,`Registrá la salida cuando el camión arranque. ${par.length} parada${par.length>1?'s':''}: ${par.join(', ')}`); await commit();
  },
  async salida(d){
    const u=user(), v=via(d.id); if(v.estado!=='PROGRAMADO'||v.origenId!==u.empresaId) return;
    for(const id of v.bultoIds){ const bl=bloqueoBulto(bul(id)); if(bl) return err(`${bul(id).codigo} no puede salir`,bl); }
    v.estado='EN_TRANSITO'; v.salida=nowISO();
    v.bultoIds.forEach(id=>{const b=bul(id); b.estado='EN_TRANSITO'; b.ubicacionId=null; unidadesDe(b).forEach(x=>x.estado='EN_TRANSITO');});
    registrar('VIAJE_SALIDA',u.id,{viaje:v.id,bultos:v.bultoIds},`${v.codigo} salió de ${nombreEmp(v.origenId)}`);
    flash('ok',`${v.codigo} en camino`,'Los destinos ya lo ven en su pantalla de recepción.'); await commit();
  },
  async lectura(d){
    const u=user(), v=via(d.id); if(v.estado!=='EN_TRANSITO'||v.origenId!==u.empresaId) return;
    const t=parseT(d.temp!==undefined?d.temp:val('t-'+v.id)); if(t===null||t<-30||t>60) return aviso('Ingresá una temperatura válida','Por ejemplo 5,2');
    const bs=v.bultoIds.map(bul), m=med(lote(bs[0].loteId).medId), ls=S.lecturas.filter(x=>x.despachoId===v.id), R=RUTAS[v.tramo], lugar=R[Math.min(ls.length+1,R.length-1)];
    S.lecturas.push({despachoId:v.id,ts:nowISO(),temp:t,lugar});
    registrar('LECTURA_TEMPERATURA',u.id,{viaje:v.id,bultos:v.bultoIds},`${v.codigo} · ${fmtT(t)} en ${lugar} (rango ${m.tMin}–${m.tMax} °C)`,{temp:t});
    if(t<m.tMin||t>m.tMax){
      const enCamion=bs.filter(b=>b.estado==='EN_TRANSITO').map(b=>b.id);
      if(!S.cuarentenas.some(c=>c.alcance==='DESPACHO'&&c.despachoId===v.id&&c.estado!=='LEVANTADA') && enCamion.length){
        registrar('RUPTURA_FRIO','sistema',{viaje:v.id,bultos:enCamion},`${v.codigo}: ${fmtT(t)} fuera de ${m.tMin}–${m.tMax} °C en ${lugar}`);
        abrirCuarentena('DESPACHO',{despachoId:v.id,bultoIds:enCamion,provincia:emp(v.origenId).provincia},'RUPTURA_FRIO',`${fmtT(t)} en ${lugar}`,true,'sistema');
      }
      flash('crit','Ruptura de cadena de frío',`${fmtT(t)} está fuera de ${m.tMin}–${m.tMax} °C. Quedaron en cuarentena solo los bultos de este camión (${enCamion.map(id=>bul(id).codigo).join(', ')}); el resto del lote sigue normal (R9).`);
    } else flash('ok',`Lectura registrada: ${fmtT(t)}`,`Dentro de rango en ${lugar}.`);
    await commit();
  },
  async robo(d){
    const u=user(), v=via(d.id), txt=val('robo-'+d.id); if(v.estado!=='EN_TRANSITO'||v.origenId!==u.empresaId) return;
    if(!txt) return aviso('Describí qué pasó','Por ejemplo: robo del camión en Acceso Sur, denuncia policial n.º …');

    v.estado='ROBADO'; bs.forEach(b=>{b.estado='ROBADO'; unidadesDe(b).forEach(x=>x.estado='ROBADA');});
    const n=bs.reduce((a,b)=>a+b.cantidad,0);
    registrar('ROBO_EXTRAVIO',u.id,{viaje:v.id,bultos:bs.map(b=>b.id)},`${v.codigo} · ${bs.map(b=>b.codigo).join(', ')} · ${n} cajas marcadas como robadas · ${txt}`);
    abrirCuarentena('DESPACHO',{despachoId:v.id,bultoIds:bs.map(b=>b.id),provincia:emp(v.origenId).provincia},'ROBO',txt,true,'sistema');
    flash('crit',`Informaste el robo de ${v.codigo}`,`${n} cajas quedan marcadas como robadas. Si alguna aparece en una farmacia, salta una alerta (R14).`); await commit();

  /* Recepción por escaneo (R8) */
  setBulto(d){ S.ui.recCod=d.q; S.ui.recRes=null; render(); },
  async recibir(d,f){
    const u=user(), cod=f.get('codigo').trim().toUpperCase(), b=bulCod(cod); S.ui.recCod=cod;
    const res=(kind,title,body)=>{S.ui.recRes={kind,title,body};};
    if(!b){ registrar('BULTO_INEXISTENTE',u.id,{empresa:u.empresaId},`Código ${cod} escaneado en ${nombreEmp(u.empresaId)}: no existe`); res('crit','Este código no existe','Ningún laboratorio armó un bulto con ese código. Puede ser una etiqueta falsa: separalo y avisá a ANMAT.'); return commit(); }
    if(b.estado==='RECIBIDO'){
      const rc=S.recepciones.filter(r=>r.bultoId===b.id).pop();
      registrar('BULTO_DUPLICADO',u.id,{bultos:[b.id]},`${b.codigo} escaneado en ${nombreEmp(u.empresaId)}, pero ya fue recibido en ${nombreEmp(rc?rc.empresaId:b.ubicacionId)}`);
      res('crit','Este bulto ya fue recibido en otro lugar',`${b.codigo} lo recibió ${nombreEmp(rc?rc.empresaId:b.ubicacionId)} el ${fmt(rc&&rc.ts)}. Un QR repetido es una posible copia.`); return commit(); }
    if(b.estado!=='EN_TRANSITO'||!b.despachoId){ res('warn','Este bulto no está viajando',`Estado actual: ${BUL_EST[b.estado][0]}.`); return render(); }
    const dest=destinoEnViaje(b); if(dest!==u.empresaId){ res('crit','Este bulto no es para tu empresa',`${b.codigo} va a ${nombreEmp(dest)}. Dejalo en el camión (R8).`); return render(); }
    const bl=bloqueoBulto(b); if(bl){ res('crit','No lo recibas',`${bl}. Separalo; lo resuelve un inspector (R10).`); return render(); }
    const v=via(b.despachoId), m=med(lote(b.loteId).medId), t=parseT(f.get('temp')), cant=parseInt(f.get('cantidad'),10), prec=!!f.get('precinto');
    if(t===null) { res('warn','Ingresá la temperatura al abrir el camión',''); return render(); }
    const prob=[]; if(!prec) prob.push('precinto roto'); if(cant!==b.cantidad) prob.push(`se contaron ${cant} cajas de ${b.cantidad}`); if(t<m.tMin||t>m.tMax) prob.push(`llegó a ${fmtT(t)}, fuera de ${m.tMin}–${m.tMax} °C`);
    const ts=nowISO();
    if(prob.length){
      b.estado='RECHAZADO'; b.despachoId=null; b.ubicacionId=u.empresaId;
      S.recepciones.push({bultoId:b.id,despachoId:v.id,empresaId:u.empresaId,ts,temp:t,precinto:prec,cantidad:cant,conforme:false,motivo:prob.join(' · '),por:u.id});
      registrar('BULTO_RECHAZADO',u.id,{viaje:v.id,bultos:[b.id],lote:b.loteId},`${b.codigo} rechazado en ${nombreEmp(u.empresaId)}: ${prob.join(' · ')}`,{temp:t});
      abrirCuarentena('BULTO',{bultoIds:[b.id],provincia:emp(u.empresaId).provincia},'RECHAZO_RECEPCION',prob.join(' · '),true,'sistema');
      res('crit',`Rechazaste ${b.codigo}`,`${prob.join(' · ')}. El bulto quedó en cuarentena; lo resuelve un inspector. Los demás bultos del camión no se ven afectados.`);
    } else {
      const fin=v.tramo===1?'EN_DEPOSITO':'RECIBIDO';
      b.estado=fin; b.despachoId=null; b.ubicacionId=u.empresaId;
      unidadesDe(b).forEach(x=>{x.estado=v.tramo===1?'EN_DEPOSITO':'EN_STOCK'; x.empresaId=u.empresaId;});
      S.recepciones.push({bultoId:b.id,despachoId:v.id,empresaId:u.empresaId,ts,temp:t,precinto:true,cantidad:cant,conforme:true,motivo:null,por:u.id});
      registrar('BULTO_RECIBIDO',u.id,{viaje:v.id,bultos:[b.id],lote:b.loteId},`${b.codigo} recibido en ${nombreEmp(u.empresaId)} a ${fmtT(t)} · precinto ${b.precinto} intacto · ${b.cantidad} cajas`,{temp:t});
      res('ok',`Recibiste ${b.codigo}`,`${b.cantidad} cajas de ${m.nombre} pasaron a ${v.tramo===1?'tu depósito':'tu stock'}.`);
      S.ui.recCod='';
    }
    if(v.bultoIds.every(id=>bul(id).estado!=='EN_TRANSITO')){ v.estado='FINALIZADO'; registrar('VIAJE_FINALIZADO','sistema',{viaje:v.id},`${v.codigo} finalizado: todos los bultos entregados o rechazados`); }
    await commit();
  },

  /* Farmacia (R11, R13, R14) */
  setSerie(d){ S.ui.dispSerie=d.q; S.ui.dispRes=null; render(); },
  async dispensar(d,f){
    const u=user(), serie=f.get('serie').trim().toUpperCase(), dni=soloDig(f.get('dni')), os=f.get('obraSocial'), af=f.get('afiliado').trim(), rx=f.get('receta').trim();
    S.ui.dispSerie=serie; const res=(k,t,b)=>{S.ui.dispRes={kind:k,title:t,body:b};};
    const un=uni(serie);
    if(!un){ registrar('SERIE_INEXISTENTE',u.id,{serie},`Serie ${serie} presentada en ${nombreEmp(u.empresaId)}: no existe`); res('crit','Serie inexistente: posible falsificación','No la dispenses. Quedó registrado para ANMAT.'); return commit(); }
    const l=lote(un.loteId);
    if(un.estado==='ROBADA'){ registrar('SERIE_ROBADA',u.id,{lote:l.id,serie},`Serie ${serie}, robada, presentada en ${nombreEmp(u.empresaId)}`); res('crit','Esta caja fue informada como robada','No la dispenses. Quedó registrado para ANMAT (R14).'); return commit(); }
    if(un.estado==='DISPENSADA'){ const p=S.dispensaciones.find(x=>x.serie===serie&&!x.anulada);
      registrar('INTENTO_DUPLICADO',u.id,{lote:l.id,serie},`Serie ${serie} ya dispensada el ${fmt(p.ts)} en ${nombreEmp(p.farmId)}`);
      res('crit','Esta serie ya fue dispensada',`Se entregó el ${fmt(p.ts)} en ${nombreEmp(p.farmId)}. Otra caja con la misma serie es una posible copia (R11).`); return commit(); }
    if(un.empresaId!==u.empresaId||un.estado!=='EN_STOCK'){ res('crit','Esta caja no está en tu stock',un.estado==='DEVUELTA'?'Fue devuelta.':`Está en ${nombreEmp(un.empresaId)} (${UNI_EST[un.estado][0].toLowerCase()}).`); return render(); }
    const bl=bloqueoUnidad(un); if(bl){ res('crit','No se puede dispensar',bl+' (R10).'); return render(); }
    if(dni&&(dni.length<7||dni.length>8)){ res('warn','DNI inválido','Tiene que tener 7 u 8 dígitos, o dejalo vacío.'); return render(); }
    const part=os.startsWith('Particular'); if(!part&&!af){ res('warn','Falta el número de afiliado','Con obra social el afiliado es obligatorio (R13).'); return render(); }
    un.estado='DISPENSADA'; const id='dis-'+(S.dispensaciones.length+1);
    S.dispensaciones.push({id,serie,farmId:u.empresaId,dni,obraSocial:os,afiliado:part?'':af,receta:rx,ts:nowISO(),anulada:false});
    registrar('DISPENSACION',u.id,{lote:l.id,serie},`Serie ${serie} · ${os}${dni?' · DNI '+maskDni(dni):''}`);
    res('ok',`Dispensaste la serie ${serie}`,`${med(l.medId).nombre} · ${os}. En la cadena el DNI queda enmascarado.`); S.ui.dispSerie=''; await commit();
  },
  async anular(d){
    const u=user(), x=S.dispensaciones.find(y=>y.id===d.id); if(!x||x.anulada||x.farmId!==u.empresaId) return;
    if(Date.now()-new Date(x.ts).getTime()>2*HORA){ S.ui.dispRes={kind:'crit',title:'Ya no se puede anular',body:'Pasaron más de 2 horas (R11).'}; return render(); }
    x.anulada=true; uni(x.serie).estado='EN_STOCK';
    registrar('ANULACION_DISPENSA',u.id,{lote:uni(x.serie).loteId,serie:x.serie},`Serie ${x.serie} vuelve al stock`);
    S.ui.dispRes={kind:'ok',title:`Anulaste la dispensación de ${x.serie}`,body:'La caja volvió a tu stock. El evento original sigue en la cadena (R12).'}; await commit();
  },

  /* Cadena y Sepolia */
  verTodo(){ S.ui.verTodo=!S.ui.verTodo; render(); },
  async verificarCadena(){ await verificar(); render(); toast(S.integridad.ok?'Cadena verificada: íntegra y coincide con Sepolia':'Cadena verificada: hay una alteración'); },
  async anclarAhora(){ await cola; const a=await anclar(); render(); toast(a?`${a.id}: eventos #${a.desde} a #${a.hasta} anclados en una transacción`:'No hay eventos nuevos'); },
  async tamper(){
    const cand=S.ledger.filter(b=>b.tipo==='LECTURA_TEMPERATURA'&&anclajeDe(b.n));
    const t=cand.find(b=>b.data.temp>8&&b.data.temp<30)||cand[Math.floor(cand.length/2)];
    S.backup=JSON.parse(JSON.stringify(S.ledger));
    const antes=t.data.temp, nuevo=antes>8&&antes<30?5.0:+(antes+4.5).toFixed(1);
    t.data.temp=nuevo; t.data.txt=t.data.txt.replace(fmtT(antes),fmtT(nuevo));
    S.tamper={desc:`Se cambió la temperatura del evento #${t.n} de ${fmtT(antes)} a ${fmtT(nuevo)} directamente en la base.`};
    await verificar(); render(); toast('Se alteró un evento guardado');
  },
  async tamperAvanzado(){
    const cand=S.ledger.filter(b=>b.tipo==='LECTURA_TEMPERATURA'&&anclajeDe(b.n));
    const t=cand[Math.floor(cand.length/2)];
    S.backup=JSON.parse(JSON.stringify(S.ledger));
    const antes=t.data.temp, nuevo=+(antes+4.5).toFixed(1);
    t.data.temp=nuevo; t.data.txt=t.data.txt.replace(fmtT(antes),fmtT(nuevo));
    for(let i=t.n-1;i<S.ledger.length;i++){ const b=S.ledger[i]; b.prev=i?S.ledger[i-1].hash:GENESIS; b.hash=await sha(cuerpo(b)); }
    S.tamper={desc:`Se cambió el evento #${t.n} (${fmtT(antes)} → ${fmtT(nuevo)}) y se recalcularon los hashes de los eventos #${t.n} a #${S.ledger.length} para que la base parezca coherente.`};
    await verificar(); render(); toast('Se reescribió la base de datos');
  },
  async restaurar(){ S.ledger=S.backup; S.backup=null; S.tamper=null; await verificar(); render(); toast('Base original restaurada'); },
};

document.addEventListener('click', e=>{
  const t=e.target.closest('[data-act]'); if(!t||t.tagName==='FORM'||t.disabled) return;
  if(S.tamper && !PERMITIDAS_CON_TAMPER.includes(t.dataset.act)) { e.preventDefault(); return toast('Restaurá la base en “Cadena y Sepolia” antes de seguir operando'); }
  const fn=A[t.dataset.act]; if(fn){ e.preventDefault(); fn({...t.dataset}); }
});
document.addEventListener('submit', e=>{
  const f=e.target; e.preventDefault();
  if(S.tamper && !PERMITIDAS_CON_TAMPER.includes(f.dataset.act)) return toast('Restaurá la base en “Cadena y Sepolia” antes de seguir operando');
  const fn=A[f.dataset.act]; if(fn) fn({...f.dataset}, new FormData(f));
});

/* reloj: cuenta regresiva de la tanda, confirmaciones y anclaje automático */
setInterval(async ()=>{
  if(!S||!S.proximaTanda) return;
  let cambio=false;
  for(const a of S.anclajes) if(a.estado==='ENVIADO'){ const c=Math.min(3,Math.floor((Date.now()-new Date(a.ts).getTime())/CONF_MS)); if(c!==a.conf){ a.conf=c; cambio=true; } if(c>=3){ a.estado='CONFIRMADO'; cambio=true; } }
  if(Date.now()>=S.proximaTanda && !S.tamper){ await cola; const a=await anclar(); if(a){ cambio=true; toast(`Tanda automática: ${a.id} ancló los eventos #${a.desde} a #${a.hasta}`); } }
  const cd=$('#cd'); if(cd){ const s=Math.max(0,Math.round((S.proximaTanda-Date.now())/1000)); cd.textContent=`${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`; }
  if(cambio){
    const ae=document.activeElement, escribiendo=ae&&['INPUT','TEXTAREA','SELECT'].includes(ae.tagName);
    if(!escribiendo && S.sesion) render(); else { const i=$('#integ'); if(i) i.outerHTML=integHTML(); }
  }
},1000);

async function boot(){
  const {s,E}=seed(); S=s;
  S.sesion=null; S.tamper=null; S.backup=null; S.bloque=6812340; S.integridad={ok:true,interna:null,sepolia:null,verificado:nowISO()};
  S.ui={loginTab:'ingresar',view:null,flash:null,trazaQ:'',pacQ:'',dispRes:null,dispSerie:'',recRes:null,recCod:'',repAbierto:null,loteSel:null,verTodo:false,ejemplo:0,pcDist:'',pcFarm:''};
  for(const e of S.empresas){ e.docNombre='habilitacion.pdf'; e.docHash=await sha(S.docs[e.id]); }
  cola=Promise.resolve();
  // Anclajes históricos: una tanda por día con actividad; los eventos de la última hora quedan pendientes.
  const corte = ago(HORA);
  let dia=null;
  for(const [ts,tipo,actor,ref,txt,extra] of E){
    const ex = tipo==='SOLICITUD_HABILITACION' ? {docHash:emp(ref.empresa).docHash} : extra;
    if(dia && ts.slice(0,10)!==dia && ts<corte){ await cola; await anclarHist(S.ledger[S.ledger.length-1], dia+'T23:55:00'); }
    registrar(tipo,actor,ref,txt,ex,ts); dia=ts.slice(0,10);
    if(ts>=corte) dia=null;
  }
  await cola;
  const pendientes=S.ledger.filter(b=>b.ts>=corte);
  if(!pendientes.length){ await anclarHist(S.ledger[S.ledger.length-1], nowISO()); }
  else if(S.ledger.length>pendientes.length && (S.anclajes.length?S.anclajes[S.anclajes.length-1].hasta:0) < S.ledger.length-pendientes.length) await anclarHist(S.ledger[S.ledger.length-pendientes.length-1], ago(HORA+5*MIN));
  S.proximaTanda=Date.now()+TANDA_MS;
  await verificar();
}
async function anclarHist(last, ts){
  const ult=S.anclajes.length?S.anclajes[S.anclajes.length-1].hasta:0; if(!last||last.n<=ult) return;
  const tx=await sha('tx|'+last.hash+'|'+ts); S.bloque+=7200+(last.n%13);
  S.anclajes.push({id:'ANC-'+p4(S.anclajes.length+1),desde:ult+1,hasta:last.n,hash:last.hash,tx,bloque:S.bloque,ts,estado:'CONFIRMADO',conf:3});
  S.sepolia.push({numero:last.n,hash:last.hash,tx,bloque:S.bloque,ts});
}
boot().then(render);

</script>
