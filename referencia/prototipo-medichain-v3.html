<title>MediChain</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=Source+Sans+3:wght@400;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
:root{
  --bg:#EEF2F1; --surface:#FFFFFF; --surface-2:#F5F8F7; --line:#D5DEDC;
  --text:#15232B; --muted:#56666E;
  --accent:#1F6FA8; --accent-ink:#FFFFFF; --accent-soft:#E1EEF7;
  --side:#10202A; --side-text:#D3DEE3; --side-muted:#869AA3; --side-hover:#1A2F3B;
  --ok:#1C7A4E; --ok-soft:#E0F2E8; --warn:#9A5800; --warn-soft:#FBEFD9;
  --crit:#B3261E; --crit-soft:#FBE3E1; --band:rgba(31,111,168,.13);
  --f-display:"Archivo", "Helvetica Neue", Arial, sans-serif;
  --f-body:"Source Sans 3", "Segoe UI", system-ui, sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0C151B; --surface:#131F27; --surface-2:#18262F; --line:#27373F;
    --text:#E2EAEE; --muted:#95A6AE; --accent:#5AA7DB; --accent-ink:#0C151B; --accent-soft:#16324A;
    --side:#081016; --side-text:#D3DEE3; --side-muted:#7C8F98; --side-hover:#13222C;
    --ok:#4CC08A; --ok-soft:#123326; --warn:#E3A546; --warn-soft:#3A2A10;
    --crit:#F0746B; --crit-soft:#3D1715; --band:rgba(90,167,219,.16);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0C151B; --surface:#131F27; --surface-2:#18262F; --line:#27373F;
  --text:#E2EAEE; --muted:#95A6AE; --accent:#5AA7DB; --accent-ink:#0C151B; --accent-soft:#16324A;
  --side:#081016; --side-text:#D3DEE3; --side-muted:#7C8F98; --side-hover:#13222C;
  --ok:#4CC08A; --ok-soft:#123326; --warn:#E3A546; --warn-soft:#3A2A10;
  --crit:#F0746B; --crit-soft:#3D1715; --band:rgba(90,167,219,.16);
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--text);font-family:var(--f-body);font-size:15px;line-height:1.5}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.2}
h1{font-size:1.5rem;font-weight:700}
h2{font-size:1.12rem;font-weight:600}
h3{font-size:.98rem;font-weight:600}
p{margin:0}
.mono{font-family:var(--f-mono);font-size:.82em;letter-spacing:0}
.muted{color:var(--muted)}
.eyebrow{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.num{font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* ---------- login ---------- */
.login{max-width:1040px;margin:0 auto;padding-block:40px 56px;padding-inline:16px;display:grid;gap:24px}
.brand{font-family:var(--f-display);font-weight:700;font-size:2rem;letter-spacing:-.01em}
.brand span{color:var(--accent)}
.login-head{display:grid;gap:6px}
.login-head p{color:var(--muted);max-width:62ch}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.tab{background:none;border:0;padding:10px 14px;cursor:pointer;color:var(--muted);font-weight:600;border-bottom:2px solid transparent;margin-bottom:-1px}
.tab[aria-selected="true"]{color:var(--text);border-bottom-color:var(--accent)}
.group{display:grid;gap:10px}
.users{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.ucard{text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;cursor:pointer;display:grid;gap:4px;align-content:start;transition:border-color .15s, transform .15s}
.ucard:hover{border-color:var(--accent);transform:translateY(-1px)}
.ucard .who{font-weight:700}
.ucard .org{color:var(--muted);font-size:.88rem}
.rolechip{font-size:.7rem;text-transform:uppercase;letter-spacing:.07em;font-weight:700;color:var(--accent)}
.rules{display:grid;gap:10px;max-width:820px}
.rule{display:grid;grid-template-columns:52px 1fr;gap:12px;padding:12px 14px;background:var(--surface);border:1px solid var(--line);border-radius:8px}
.rule b{font-family:var(--f-mono);color:var(--accent);font-size:.9rem}
.steps{display:grid;gap:8px;max-width:820px;padding:0;margin:0;list-style:none;counter-reset:s}
.steps li{counter-increment:s;display:grid;grid-template-columns:34px 1fr;gap:10px;padding:10px 14px;background:var(--surface);border:1px solid var(--line);border-radius:8px}
.steps li::before{content:counter(s);font-family:var(--f-display);font-weight:700;color:var(--accent);font-size:1.05rem}
.note{font-size:.88rem;color:var(--muted);max-width:75ch}

/* ---------- app ---------- */
.app{display:grid;grid-template-columns:250px minmax(0,1fr);min-height:100vh}
.side{background:var(--side);color:var(--side-text);padding:20px 14px;display:flex;flex-direction:column;gap:18px;position:sticky;top:0;height:100vh;overflow:auto}
.side .brand{font-size:1.35rem;color:#fff;padding-inline:8px}
.side .brand span{color:#6FB6E6}
.me{padding:12px;border:1px solid rgba(255,255,255,.1);border-radius:8px;display:grid;gap:2px}
.me .n{font-weight:700;color:#fff}
.me .r{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:#6FB6E6;font-weight:700}
.me .o{font-size:.84rem;color:var(--side-muted)}
.nav{display:grid;gap:2px}
.nav button{display:flex;justify-content:space-between;align-items:center;gap:8px;background:none;border:0;color:var(--side-text);padding:9px 10px;border-radius:6px;cursor:pointer;text-align:left;font-weight:600}
.nav button:hover{background:var(--side-hover)}
.nav button[aria-current="page"]{background:#1F6FA8;color:#fff}
.nav .count{font-size:.75rem;background:rgba(255,255,255,.14);border-radius:10px;padding:0 7px;font-variant-numeric:tabular-nums}
.nav .count.hot{background:#C8453C;color:#fff}
.side-foot{margin-top:auto;display:grid;gap:6px}
.side-foot button{background:none;border:1px solid rgba(255,255,255,.16);color:var(--side-text);padding:8px 10px;border-radius:6px;cursor:pointer;font-weight:600}
.side-foot button:hover{background:var(--side-hover)}
.main{padding-block:22px 48px;padding-inline:28px;display:grid;gap:18px;align-content:start;min-width:0}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.content{display:grid;gap:18px;min-width:0}

/* ---------- blocks ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px;display:grid;gap:12px;min-width:0;align-content:start}
.itrow{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.itrow > div{flex:1;min-width:0}
.itrow > .btn{flex:none}
.card-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;display:grid;gap:2px}
.tile .v{font-family:var(--f-display);font-size:1.7rem;font-weight:700;font-variant-numeric:tabular-nums}
.tile.crit .v{color:var(--crit)} .tile.warn .v{color:var(--warn)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
.grid4{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.party{border:1px solid var(--line);border-radius:8px;padding:12px;background:var(--surface-2);display:grid;gap:3px;align-content:start}
.party .nm{font-weight:700}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:.92rem}
.kv dt{color:var(--muted)} .kv dd{margin:0}

.pill{display:inline-flex;align-items:center;gap:6px;font-size:.76rem;font-weight:700;padding:2px 9px;border-radius:999px;white-space:nowrap;border:1px solid transparent}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.crit{background:var(--crit-soft);color:var(--crit)}
.pill.info{background:var(--accent-soft);color:var(--accent)}
.pill.neutral{background:var(--surface-2);color:var(--muted);border-color:var(--line)}
.integrity{font-size:.82rem;padding:5px 12px}

.flash{border-radius:8px;padding:12px 14px;border:1px solid;display:grid;gap:2px}
.flash.ok{background:var(--ok-soft);border-color:color-mix(in srgb,var(--ok) 35%,transparent);color:var(--text)}
.flash.warn{background:var(--warn-soft);border-color:color-mix(in srgb,var(--warn) 35%,transparent)}
.flash.crit{background:var(--crit-soft);border-color:color-mix(in srgb,var(--crit) 40%,transparent)}
.flash.info{background:var(--accent-soft);border-color:color-mix(in srgb,var(--accent) 35%,transparent)}
.flash b{font-weight:700}

.item{display:grid;grid-template-columns:4px 1fr;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.item:first-child{border-top:0}
.item .stripe{border-radius:2px;background:var(--line)}
.item.crit .stripe{background:var(--crit)} .item.warn .stripe{background:var(--warn)} .item.info .stripe{background:var(--accent)} .item.ok .stripe{background:var(--ok)}

.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:8px}
table{width:100%;border-collapse:collapse;font-size:.9rem}
th{font-size:.72rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);text-align:left;font-weight:700;padding:9px 12px;background:var(--surface-2);border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
tr.bad td{background:var(--crit-soft)}
tr.after td{opacity:.55}

form.stack{display:grid;gap:12px}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
label.f{display:grid;gap:4px;font-size:.85rem;font-weight:600;color:var(--muted)}
input,select,textarea{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:7px;background:var(--surface);color:var(--text);font-weight:400;font-size:.95rem}
textarea{min-height:70px;resize:vertical}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row > input{flex:1 1 160px;width:auto}
.btn{background:var(--accent);color:var(--accent-ink);border:1px solid var(--accent);padding:8px 14px;border-radius:7px;font-weight:700;cursor:pointer;white-space:nowrap}
.btn:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent;color:var(--accent)}
.btn.danger{background:var(--crit);border-color:var(--crit);color:#fff}
.btn.warn{background:var(--warn);border-color:var(--warn);color:#fff}
.btn.sm{padding:5px 10px;font-size:.85rem}
.btn[disabled]{opacity:.45;cursor:not-allowed;filter:none}
.chip{background:var(--surface-2);border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-family:var(--f-mono);font-size:.8rem;cursor:pointer;color:var(--text)}
.chip:hover{border-color:var(--accent)}
.checks{list-style:none;padding:0;margin:0;display:grid;gap:8px}
.checks li{display:grid;grid-template-columns:26px 1fr;gap:8px;align-items:start}
.mark{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:.8rem}
.mark.ok{background:var(--ok-soft);color:var(--ok)} .mark.crit{background:var(--crit-soft);color:var(--crit)} .mark.warn{background:var(--warn-soft);color:var(--warn)}
.verdict{font-family:var(--f-display);font-size:1.3rem;font-weight:700}
.verdict.ok{color:var(--ok)} .verdict.crit{color:var(--crit)} .verdict.warn{color:var(--warn)}
.gs1{font-family:var(--f-mono);font-size:.8rem;background:var(--surface-2);border:1px dashed var(--line);border-radius:6px;padding:6px 9px;word-break:break-all}
.spark{width:100%;max-width:300px;height:auto;display:block}
.spark .band{fill:var(--band)}
.spark .line{fill:none;stroke:var(--accent);stroke-width:2}
.spark .pt{fill:var(--accent)} .spark .pt-bad{fill:var(--crit)}
.spark text{fill:var(--muted);font-size:9px;font-family:var(--f-body)}
.hash{font-family:var(--f-mono);font-size:.78rem;color:var(--muted)}
.empty{color:var(--muted);padding:6px 0}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));background:var(--text);color:var(--bg);padding:10px 16px;border-radius:8px;font-weight:600;box-shadow:0 8px 24px rgba(0,0,0,.2);max-width:calc(100% - 32px);z-index:10}
.loading{padding:40px 16px;text-align:center;color:var(--muted)}

@media (max-width:860px){
  .app{grid-template-columns:1fr}
  .side{position:static;height:auto;padding:14px 16px;gap:12px}
  .nav{display:flex;overflow-x:auto;gap:4px;padding-bottom:4px}
  .nav button{flex:0 0 auto}
  .side-foot{flex-direction:row;display:flex;margin-top:0}
  .main{padding-inline:16px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
.route{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-weight:600}
.route .arr{color:var(--muted);font-weight:400}
.code{font-family:var(--f-mono);font-size:.84rem;background:var(--surface-2);border:1px solid var(--line);border-radius:6px;padding:1px 7px;white-space:nowrap}
.bopts{display:grid;gap:6px}
.bopt{display:grid;grid-template-columns:22px 1fr;gap:10px;align-items:start;padding:9px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface-2);font-size:.92rem;color:var(--text);font-weight:400}
.bopt input{width:auto;margin-top:4px}
.bopt.off{opacity:.55}
label.inline{display:flex;gap:8px;align-items:center;font-weight:600;font-size:.9rem;color:var(--text)}
label.inline input{width:auto}
.acc{display:grid;gap:4px;font-size:.88rem}
.split{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px}
.cd{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.sub{font-size:.85rem}
.hl td{background:var(--accent-soft)}
details.more summary{cursor:pointer;color:var(--accent);font-weight:600}
.stack{display:grid;gap:8px}
.wide table{min-width:1080px}
.wide td{font-size:.86rem}
</style>

<div id="app"><div class="loading">Calculando la cadena de hashes…</div></div>
<div id="toast" class="toast" hidden></div>
<script>
/* =====================================================================
   MediChain · prototipo v3 (datos ficticios)
   Sigue el documento "MediChain: requerimientos del backend".
   Cada colección de S equivale a una tabla del backend Java.
   ===================================================================== */
const GENESIS = 'GENESIS';
const HOY = new Date();
const MIN = 60e3, HORA = 3600e3;
const TANDA_MS = 5 * MIN;          // anclaje por tandas cada 5 minutos (R15)
const CONF_MS = 12e3;              // un bloque de Sepolia cada ~12 s; 3 confirmaciones

const PROVINCIAS = ['Buenos Aires','CABA','Catamarca','Chaco','Chubut','Córdoba','Corrientes','Entre Ríos','Formosa','Jujuy','La Pampa','La Rioja','Mendoza','Misiones','Neuquén','Río Negro','Salta','San Juan','San Luis','Santa Cruz','Santa Fe','Santiago del Estero','Tierra del Fuego','Tucumán'];

const ROL_LBL = {SEDE_CENTRAL:'Sede Central ANMAT', INSPECTOR:'Inspector ANMAT', LABORATORIO:'Laboratorio', DISTRIBUIDOR:'Distribuidora', FARMACIA:'Farmacia', PACIENTE:'Paciente'};
const TIPO_EMP = {LABORATORIO:'Laboratorio', DISTRIBUIDOR:'Distribuidora', FARMACIA:'Farmacia'};
const EMP_EST = {PENDIENTE:['Pendiente','warn'], HABILITADA:['Habilitada','ok'], RECHAZADA:['Rechazada','crit'], SUSPENDIDA:['Suspendida','crit']};
const CIR_EST = {PENDIENTE_EMPRESAS:['Esperando a las empresas','warn'], PENDIENTE_INSPECTOR:['Esperando al inspector','warn'], APROBADO:['Aprobado','ok'], RECHAZADO:['Rechazado','crit'], SUSPENDIDO:['Suspendido','crit']};
const LOTE_EST = {PENDIENTE_LIBERACION:['Pendiente de liberación','warn'], LIBERADO:['Liberado','ok'], CUARENTENA:['Cuarentena','crit'], RECALL:['Recall','crit']};
const BUL_EST = {ARMADO:['Armado','neutral'], EN_TRANSITO:['En tránsito','info'], EN_DEPOSITO:['En depósito','info'], RECIBIDO:['Recibido','ok'], RECHAZADO:['Rechazado','crit'], ROBADO:['Robado','crit']};
const VIA_EST = {PROGRAMADO:['Programado','neutral'], EN_TRANSITO:['En tránsito','info'], FINALIZADO:['Finalizado','ok'], ROBADO:['Robado','crit']};
const UNI_EST = {EN_LABORATORIO:['En laboratorio','neutral'], EN_TRANSITO:['En tránsito','info'], EN_DEPOSITO:['En depósito','info'], EN_STOCK:['En stock','ok'], DISPENSADA:['Dispensada','neutral'], DEVUELTA:['Devuelta','warn'], ROBADA:['Robada','crit']};
const CUA_EST = {ACTIVA:['Activa','crit'], LEVANTADA:['Levantada','ok'], CONVERTIDA_EN_RECALL:['Recall','crit']};
const ALCANCE = {LOTE:'Lote', DESPACHO:'Viaje', BULTO:'Bulto'};
const MOTIVO = {RUPTURA_FRIO:'Ruptura de cadena de frío', ROBO:'Robo o extravío', RECHAZO_RECEPCION:'Recepción rechazada', DEFECTO_CALIDAD:'Defecto de calidad', PREVENTIVA:'Preventiva'};
const REP_EST = {ABIERTO:['Nuevo','crit'], EN_INVESTIGACION:['En investigación','warn'], CERRADO:['Cerrado','ok']};
const ANC_EST = {ENVIADO:['Esperando confirmaciones','warn'], CONFIRMADO:['Confirmado','ok']};

/* Lista única de tipos de evento: la misma que el enum TipoEvento del backend */
const TIPO_EVT = {
  ALTA_INSPECTOR:'Alta de inspector', BAJA_INSPECTOR:'Baja de inspector', REACTIVACION_INSPECTOR:'Reactivación de inspector',
  SOLICITUD_HABILITACION:'Solicitud de habilitación', SOLICITUD_TOMADA:'Solicitud tomada', SOLICITUD_ASIGNADA:'Solicitud asignada por la Sede',
  HABILITACION_APROBADA:'Empresa habilitada', HABILITACION_RECHAZADA:'Habilitación rechazada', EMPRESA_SUSPENDIDA:'Empresa suspendida', EMPRESA_REHABILITADA:'Empresa rehabilitada',
  CIRCUITO_PROPUESTO:'Circuito propuesto', CIRCUITO_ACEPTADO:'Circuito aceptado', CIRCUITO_RECHAZADO:'Circuito rechazado', CIRCUITO_TOMADO:'Circuito tomado',
  CIRCUITO_APROBADO:'Circuito aprobado', CIRCUITO_SUSPENDIDO:'Circuito suspendido', CIRCUITO_REHABILITADO:'Circuito rehabilitado',
  LOTE_REGISTRADO:'Lote registrado', LOTE_LIBERADO:'Lote liberado', BULTO_ARMADO:'Bultos armados',
  VIAJE_CREADO:'Viaje creado', VIAJE_SALIDA:'Salida del camión', LECTURA_TEMPERATURA:'Lectura de temperatura', RUPTURA_FRIO:'Ruptura de cadena de frío',
  BULTO_RECIBIDO:'Bulto recibido', BULTO_RECHAZADO:'Bulto rechazado', BULTO_INEXISTENTE:'Bulto inexistente escaneado', BULTO_DUPLICADO:'Bulto ya recibido escaneado',
  VIAJE_FINALIZADO:'Viaje finalizado', ROBO_EXTRAVIO:'Robo o extravío',
  CUARENTENA:'Cuarentena', CUARENTENA_LEVANTADA:'Cuarentena levantada', RECALL:'Recall',
  DISPENSACION:'Dispensación', ANULACION_DISPENSA:'Dispensa anulada', DEVOLUCION:'Devolución',
  INTENTO_DUPLICADO:'Serie ya dispensada presentada', SERIE_INEXISTENTE:'Serie inexistente', SERIE_ROBADA:'Serie robada presentada',
  REPORTE_CIUDADANO:'Reporte ciudadano', REPORTE_TOMADO:'Reporte tomado', REPORTE_CERRADO:'Reporte cerrado',
};

const RULES = [
  ['R1','Solo la Sede Central da de alta y de baja a los inspectores.'],
  ['R2','Solo operan empresas habilitadas. Las habilita un inspector de su provincia; si la provincia no tiene inspectores, la Sede asigna uno.'],
  ['R3','Cada caja lleva GTIN + número de serie único (alfanumérico, hasta 20 caracteres, sin empezar con 779).'],
  ['R4','Un lote común lo libera el director técnico del laboratorio; un biológico, un inspector de la provincia del laboratorio.'],
  ['R5','Un circuito une laboratorio, distribuidora y farmacia habilitados. Lo propone el DT del laboratorio, aceptan las otras dos y aprueba el inspector de la provincia de la farmacia.'],
  ['R6','Un bulto tiene cajas de un solo lote liberado y un circuito aprobado. Una vez que sale, no cambia su contenido ni su destino.'],
  ['R7','Tramo 1: el laboratorio despacha a la distribuidora del circuito. Tramo 2: la distribuidora despacha a las farmacias. Un viaje puede tener varias paradas.'],
  ['R8','Solo recibe la empresa destino del bulto. Precinto roto, cantidad distinta o temperatura fuera de rango obligan a rechazar, y el bulto queda en cuarentena.'],
  ['R9','Una lectura fuera de rango pone en cuarentena automática todos los bultos del camión. Tras una ruptura de frío solo cabe el recall.'],
  ['R10','Una caja está bloqueada si su lote, su viaje o su bulto tienen cuarentena o recall, o si el lote venció. Bloqueada no viaja, no se recibe y no se dispensa.'],

/* Dígitos verificadores reales: GS1 (GTIN, GLN) y CUIT (módulo 11) */
function gs1DV(d){ let s=0; for(let i=0;i<d.length;i++){ const x=+d[d.length-1-i]; s+=x*(i%2===0?3:1); } return String((10-(s%10))%10); }
const conDV = d => d+gs1DV(d);
const gs1Valido = c => /^\d{8,14}$/.test(c) && gs1DV(c.slice(0,-1))===c.slice(-1);
function cuitDV(p){ const w=[5,4,3,2,7,6,5,4,3,2]; let s=0; for(let i=0;i<10;i++) s+=+p[i]*w[i]; let r=11-(s%11); if(r===11) r=0; return r===10?null:String(r); }
function mkCuit(p){ let n=+p; while(cuitDV(String(n))===null) n++; const q=String(n); return `${q.slice(0,2)}-${q.slice(2)}-${cuitDV(q)}`; }
const soloDig = s => String(s||'').replace(/\D/g,'');
const cuitValido = c => { const d=soloDig(c); return d.length===11 && cuitDV(d.slice(0,10))===d[10]; };

/* ---------------- cadena de hashes (R15) ---------------- */
async function sha(str){
  if(window.crypto && crypto.subtle){
    const b = await crypto.subtle.digest('SHA-256', typeof str==='string' ? new TextEncoder().encode(str) : str);
    return '0x'+[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('');
  }
  let s = typeof str==='string' ? str : [...new Uint8Array(str)].join(','), out='';
  for(let k=0;k<4;k++){ let h1=0xdeadbeef^k, h2=0x41c6ce57^k;
    for(let i=0;i<s.length;i++){const c=s.charCodeAt(i); h1=Math.imul(h1^c,2654435761); h2=Math.imul(h2^c,1597334677);}
    h1=Math.imul(h1^(h1>>>16),2246822507)^Math.imul(h2^(h2>>>13),3266489909);
    h2=Math.imul(h2^(h2>>>16),2246822507)^Math.imul(h1^(h1>>>13),3266489909);
    out+=(h2>>>0).toString(16).padStart(8,'0')+(h1>>>0).toString(16).padStart(8,'0'); }
  return '0x'+out;
}
const cuerpo = b => JSON.stringify({n:b.n,ts:b.ts,tipo:b.tipo,actor:b.actor,ref:b.ref,data:b.data,prev:b.prev});
let cola = Promise.resolve();
function registrar(tipo, actor, ref, txt, extra, ts){
  cola = cola.then(async ()=>{
    const prev = S.ledger.length ? S.ledger[S.ledger.length-1].hash : GENESIS;
    const b = {n:S.ledger.length+1, ts: ts || nowISO(), tipo, actor, ref:ref||{}, data:{txt, ...(extra||{})}, prev};
    b.hash = await sha(cuerpo(b));
    S.ledger.push(b);
  });
  return cola;
}
/* Verificación: (1) coherencia interna de la base; (2) comparación contra lo anclado en Sepolia */
async function verificar(){
  let prevStored=GENESIS, prevRecalc=GENESIS, interna=null, sep=null;
  const recalc={};
  for(const b of S.ledger){
    const hStored = await sha(cuerpo(b));
    if(interna===null && (b.prev!==prevStored || hStored!==b.hash)) interna=b.n;
    prevStored=b.hash;
    const hR = await sha(cuerpo({...b, prev:prevRecalc}));
    recalc[b.n]=hR; prevRecalc=hR;
  }
  for(const a of S.sepolia){ if(recalc[a.numero]!==a.hash){ sep=a; break; } }
  S.integridad = {ok: interna===null && !sep, interna, sepolia: sep, verificado: nowISO()};
}
function anclajeDe(n){ return S.anclajes.find(a=>n>=a.desde && n<=a.hasta) || null; }
async function anclar(){
  const ult = S.anclajes.length ? S.anclajes[S.anclajes.length-1].hasta : 0;
  S.proximaTanda = Date.now() + TANDA_MS;
  if(S.ledger.length<=ult) return null;
  const last = S.ledger[S.ledger.length-1];
  const tx = await sha('tx|'+last.hash+'|'+Date.now());
  S.bloque += 3 + (S.anclajes.length % 7);
  const a = {id:'ANC-'+p4(S.anclajes.length+1), desde:ult+1, hasta:last.n, hash:last.hash, tx, bloque:S.bloque, ts:nowISO(), estado:'ENVIADO', conf:0};
  S.anclajes.push(a);
  S.sepolia.push({numero:last.n, hash:last.hash, tx, bloque:a.bloque, ts:a.ts}); // lo que queda en la blockchain: nadie lo puede editar
  return a;
}

    ev(c.creado,'CIRCUITO_PROPUESTO','u-andes',{circuito:c.id},`${c.codigo}: Andes Pharma → Distribuidora Cuyo → ${s.empresas.find(e=>e.id===c.farmId).razon}`);

  }
  // lotes, bultos, viajes
  let nb=0, nv=0;
  const mkLote=(id,cod,medId,cant,fab,venc,creado,lib,libTs)=>{

  const mkBultos=(l,circs,cajas,ts)=>{

    s.viajes.push(v);
    bs.forEach(b=>{ b.despachoId=v.id; b.viajes.push(v.id); b.estado='EN_TRANSITO'; s.unidades.filter(u=>u.bultoId===b.id).forEach(u=>u.estado='EN_TRANSITO'); });
    const dest=[...new Set(bs.map(b=>{const c=s.circuitos.find(x=>x.id===b.circuitoId); return tramo===1?c.distId:c.farmId;}))].map(id=>s.empresas.find(e=>e.id===id).razon);
    ev(creado,'VIAJE_CREADO',autor,{viaje:v.id,bultos:v.bultoIds},`${v.codigo} · tramo ${tramo} · camión ${patente} · chofer ${chofer} · ${bs.map(b=>b.codigo).join(', ')} · paradas: ${dest.join(', ')}`);
    ev(salida,'VIAJE_SALIDA',autor,{viaje:v.id,bultos:v.bultoIds},`${v.codigo} salió de ${s.empresas.find(e=>e.id===origen).razon}`);
    const m=s.medicamentos.find(x=>x.id===s.lotes.find(l=>l.id===bs[0].loteId).medId);
    for(const [ts,t,lugar] of lecturas){ s.lecturas.push({despachoId:v.id,ts,temp:t,lugar}); ev(ts,'LECTURA_TEMPERATURA',autor,{viaje:v.id,bultos:v.bultoIds},`${v.codigo} · ${fmtT(t)} en ${lugar} (rango ${m.tMin}–${m.tMax} °C)`,{temp:t}); }
    for(const [b,ts,t,empId,userId] of recs){
      const fin = tramo===1?'EN_DEPOSITO':'RECIBIDO';
      b.estado=fin; b.ubicacionId=empId; b.despachoId=null;
      s.unidades.filter(u=>u.bultoId===b.id).forEach(u=>{u.estado=tramo===1?'EN_DEPOSITO':'EN_STOCK'; u.empresaId=empId;});
      s.recepciones.push({bultoId:b.id,despachoId:v.id,empresaId:empId,ts,temp:t,precinto:true,cantidad:b.cantidad,conforme:true,motivo:null,por:userId});
      ev(ts,'BULTO_RECIBIDO',userId,{viaje:v.id,bultos:[b.id],lote:b.loteId},`${b.codigo} recibido en ${s.empresas.find(e=>e.id===empId).razon} a ${fmtT(t)} · precinto ${b.precinto} intacto · ${b.cantidad} cajas`,{temp:t});
    }
    if(recs.length && recs.length===bs.length){ v.estado='FINALIZADO'; ev(recs[recs.length-1][1].replace(/:(\d\d)$/,':30'),'VIAJE_FINALIZADO','sistema',{viaje:v.id},`${v.codigo} finalizado: todos los bultos entregados`); }
    return v;
  };

  // Lote 1: insulina ya distribuida y en las farmacias
  const l1=mkLote('lot-1','L2026-0398','med-ins',400,'2026-08-10','2027-08-10','2026-08-10T15:00:00','ins-1','2026-08-14T11:05:00');
  const [b1,b2]=mkBultos(l1,['cir-1','cir-2'],200,'2026-08-15T09:00:00');
  mkViaje(1,[b1,b2],'AB 123 CD','Jorge Lucero','2026-08-18T07:00:00','2026-08-18T07:30:00','2026-08-18T12:00:00',
    [['2026-08-18T08:30:00',4.8,RUTA1[1]],['2026-08-18T10:00:00',5.2,RUTA1[2]]],
    [[b1,'2026-08-18T11:40:00',5.1,'emp-cuyo','u-cuyo'],[b2,'2026-08-18T11:42:00',5.1,'emp-cuyo','u-cuyo']]);
  mkViaje(2,[b1,b2],'AF 992 XK','Raúl Ortiz','2026-08-19T06:40:00','2026-08-19T07:00:00','2026-08-19T11:00:00',
    [['2026-08-19T08:00:00',4.9,'Acceso Sur · Luján de Cuyo'],['2026-08-19T09:40:00',5.4,'Av. San Martín · Godoy Cruz']],
    [[b1,'2026-08-19T09:10:00',5.3,'emp-centro','u-centro'],[b2,'2026-08-19T10:05:00',5.0,'emp-godoy','u-godoy']]);
  // Lote 3 y 2: insulina (en viaje hoy) y amoxicilina (en depósito)
  const l3=mkLote('lot-3','L2026-0412','med-ins',400,'2026-09-05','2027-09-05','2026-09-05T16:00:00','ins-2','2026-09-09T12:00:00');
  const l2=mkLote('lot-2','L2026-0415','med-amx',1000,'2026-09-10','2028-09-10','2026-09-10T15:30:00','u-andes','2026-09-12T10:00:00');
  const bs2=mkBultos(l2,['cir-1','cir-1','cir-2','cir-2','cir-2'],200,'2026-09-13T09:00:00');
  const bs3=mkBultos(l3,['cir-1','cir-2'],200,'2026-09-14T09:00:00');
  mkViaje(1,bs2,'AB 123 CD','Jorge Lucero','2026-09-15T07:40:00','2026-09-15T08:00:00','2026-09-15T12:00:00',
    [['2026-09-15T09:00:00',22.5,RUTA1[1]],['2026-09-15T10:30:00',23.1,RUTA1[2]]],
    bs2.map((b,i)=>[b,`2026-09-15T11:${String(30+i).padStart(2,'0')}:00`,23.0,'emp-cuyo','u-cuyo']));
  mkViaje(1,bs3,'AB 123 CD','Jorge Lucero','2026-09-20T07:40:00','2026-09-20T08:00:00','2026-09-20T12:00:00',
    [['2026-09-20T09:00:00',4.6,RUTA1[1]]],
    bs3.map((b,i)=>[b,`2026-09-20T11:0${i}:00`,4.9,'emp-cuyo','u-cuyo']));
  // Lotes pendientes de liberación
  mkLote('lot-4','L2026-0520','med-vac',600,'2026-09-20','2027-03-20','2026-09-22T10:00:00',null,null);
  mkLote('lot-5','L2026-0602','med-amx',400,'2026-09-24','2028-09-24','2026-09-26T10:00:00',null,null);

  // Dispensaciones y reporte
  const d1u='0398S000001', d2u='0398S000002';
  s.unidades.find(u=>u.serie===d1u).estado='DISPENSADA';
  s.dispensaciones.push({id:'dis-1',serie:d1u,farmId:'emp-centro',dni:'30456789',obraSocial:'OSEP Mendoza',afiliado:'100-448120-02',receta:'RX-MZA-448120',ts:'2026-09-02T18:12:00',anulada:false});
  ev('2026-09-02T18:12:00','DISPENSACION','u-centro',{lote:'lot-1',serie:d1u},`Serie ${d1u} · OSEP Mendoza · DNI ${maskDni('30456789')}`);
  s.reportes.push({id:'REP-1041',serie:d1u,dni:'30456789',motivo:'Envase dañado o adulterado',desc:'La lapicera tenía el líquido turbio y me dio mareos.',ts:'2026-09-27T08:00:00',estado:'ABIERTO',inspectorId:null,loteId:'lot-1',provincia:'Mendoza',conclusion:null});
  ev('2026-09-27T08:00:00','REPORTE_CIUDADANO','u-pac',{lote:'lot-1',serie:d1u,reporte:'REP-1041'},`REP-1041 · Envase dañado o adulterado · serie ${d1u}`);

  // Hoy: un viaje del tramo 2 en curso y una dispensación anulable
  const v5=mkViaje(2,bs3,'AE 441 ZZ','Mónica Ríos',ago(3*HORA+20*MIN),ago(3*HORA),iso(new Date(Date.now()+2*HORA)),
    [[ago(2.5*HORA),4.4,'Acceso Sur · Luján de Cuyo'],[ago(1.5*HORA),5.2,'Av. San Martín · Godoy Cruz'],[ago(30*MIN),5.8,'Av. Las Heras · Ciudad']],[]);
  s.unidades.find(u=>u.serie===d2u).estado='DISPENSADA';
  s.dispensaciones.push({id:'dis-2',serie:d2u,farmId:'emp-centro',dni:'27881345',obraSocial:'PAMI',afiliado:'150-221907-00',receta:'RX-MZA-451007',ts:ago(40*MIN),anulada:false});
  ev(ago(40*MIN),'DISPENSACION','u-centro',{lote:'lot-1',serie:d2u},`Serie ${d2u} · PAMI · DNI ${maskDni('27881345')}`);

  E.sort((a,b)=>a[0]<b[0]?-1:a[0]>b[0]?1:0);
  return {s,E};
}

/* ---- bandejas (RF-BAN-01) ---- */
function bandejaInspector(u){
  const i=insDe(u), prov=i.provincia;
  return {
    empresas: S.empresas.filter(e=>e.estado==='PENDIENTE' && ((e.provincia===prov && !e.inspectorId) || e.inspectorId===i.id)),
    circuitos: S.circuitos.filter(c=>c.estado==='PENDIENTE_INSPECTOR' && ((emp(c.farmId).provincia===prov && !c.inspectorId) || c.inspectorId===i.id)),
    liberar: S.lotes.filter(l=>l.estado==='PENDIENTE_LIBERACION' && med(l.medId).biologico && emp(l.labId).provincia===prov),
    cuarentenas: S.cuarentenas.filter(c=>c.estado==='ACTIVA' && c.provincia===prov),
    reportes: S.reportes.filter(r=>r.estado!=='CERRADO' && r.provincia===prov && (!r.inspectorId || r.inspectorId===i.id)),
  };
}
const provSinInspector = p => inspectoresActivos(p).length===0;
function bandejaSede(){
  return {
    empresas: S.empresas.filter(e=>e.estado==='PENDIENTE' && !e.inspectorId && provSinInspector(e.provincia)),
    circuitos: S.circuitos.filter(c=>c.estado==='PENDIENTE_INSPECTOR' && !c.inspectorId && provSinInspector(emp(c.farmId).provincia)),
  };
}
const circuitosPorAceptar = u => S.circuitos.filter(c=>c.estado==='PENDIENTE_EMPRESAS' && ((c.distId===u.empresaId && !c.aceptDist) || (c.farmId===u.empresaId && !c.aceptFarm)));
const bultosEntrantes = u => S.bultos.filter(b=>b.estado==='EN_TRANSITO' && via(b.despachoId) && via(b.despachoId).estado==='EN_TRANSITO' && destinoEnViaje(b)===u.empresaId);

function navCount(v,u){
  if(v==='bandeja'){
    if(u.rol==='INSPECTOR'){ const b=bandejaInspector(u); return b.empresas.length+b.circuitos.length+b.liberar.length+b.cuarentenas.length+b.reportes.length; }
    if(u.rol==='SEDE_CENTRAL'){ const b=bandejaSede(); return b.empresas.length+b.circuitos.length; }
  }
  if(v==='circuitos' && u.empresaId) return circuitosPorAceptar(u).length;
  if(v==='recepcion') return bultosEntrantes(u).length;
  if(v==='reportes' && u.rol==='INSPECTOR') return bandejaInspector(u).reportes.length;
  return 0;
}

/* ---------------- estructura ---------------- */

  if(u.rol==='PACIENTE') org='DNI '+fmtDni(u.dni);
  const bloq=bloqueoSesion(u);
  const nav = bloq ? '' : NAV[u.rol].map(([v,l])=>{ const c=navCount(v,u); return `<button data-act="nav" data-view="${v}" ${S.ui.view===v?'aria-current="page"':''}>${l}${c?`<span class="count hot">${c}</span>`:''}</button>`; }).join('');
  const roles = u.empresaId ? [u.admin?'Admin':'', u.dt?'Director técnico':''].filter(Boolean).join(' · ') : '';
  return `<div class="app"><aside class="side"><div class="brand">Medi<span>Chain</span></div>

      ${S.tamper?`<div class="flash crit"><b>Modo demostración: la base de datos fue alterada.</b><span>Restaurá la cadena en “Cadena y Sepolia” antes de seguir operando.</span></div>`:''}
      ${flashHTML()}<div class="content">${bloq||renderVista(u)}</div></main></div>`;
}
function bloqueoSesion(u){
  if(u.rol==='INSPECTOR' && insDe(u).estado!=='ACTIVO') return `<div class="card"><h2>Tu usuario de inspector está dado de baja</h2><p class="muted">La Sede Central lo desactivó (R1). Tus acciones pasadas siguen en la cadena.</p></div>`;
  if(u.empresaId){ const e=emp(u.empresaId);
    if(e.estado!=='HABILITADA'){
      const i=e.inspectorId?ins(e.inspectorId):null;
      const donde = e.estado==='PENDIENTE' ? (i?`La está revisando ${i.nombre} (${i.legajo}).`:provSinInspector(e.provincia)?`${e.provincia} no tiene inspectores: la solicitud está en la bandeja de la Sede Central.`:`Está en la bandeja de los inspectores de ${e.provincia}.`) : '';
      const msg = e.estado==='PENDIENTE' ? `Tu solicitud de habilitación está en revisión. ${donde} Hasta que la aprueben no podés operar (R2).`
        : e.estado==='SUSPENDIDA' ? 'Tu empresa está suspendida. Sus circuitos quedaron suspendidos y no podés operar.' : 'Tu habilitación fue rechazada. Motivo: '+(e.motivoRechazo||'—');
      return `<div class="card"><div class="card-head"><h2>${esc(e.razon)}</h2>${estPill(EMP_EST,e.estado)}</div><p>${esc(msg)}</p>${fichaEmpresa(e)}</div>`;
    } }
  return '';
}
function fichaEmpresa(e){
  return `<dl class="kv"><dt>Tipo</dt><dd>${TIPO_EMP[e.tipo]}</dd><dt>CUIT</dt><dd class="num">${e.cuit}</dd><dt>GLN</dt><dd class="num">${e.gln}</dd><dt>Ubicación</dt><dd>${esc(e.localidad)}, ${esc(e.provincia)}</dd>
    <dt>Habilitación</dt><dd>${esc(e.habilitacion)}</dd><dt>Director técnico</dt><dd>${esc(e.dt)}</dd><dt>PDF</dt><dd>${esc(e.docNombre||'habilitacion.pdf')} · <span class="hash">${short(e.docHash)}</span></dd><dt>Solicitud</dt><dd>${fmt(e.solicitud)}</dd></dl>`;
}
function renderVista(u){
  const v=S.ui.view;
  const m={bandeja:vBandeja, inspectores:vInspectores, empresas:vEmpresas, circuitos:vCircuitos, lotes:u.rol==='LABORATORIO'?vLotesLab:vLotesIns, traza:vTraza,
    reportes:vReportes, registro:vRegistro, viajes:vViajes, recepcion:vRecepcion, deposito:vDeposito, stock:vStock, dispensar:vDispensar, verificar:vVerificar, mismeds:vMisMeds};

/* ---------------- piezas comunes ---------------- */
const ruta = c => `<span class="route">${esc(nombreEmp(c.labId))}<span class="arr">→</span>${esc(nombreEmp(c.distId))}<span class="arr">→</span>${esc(nombreEmp(c.farmId))}</span>`;
function spark(vals,tMin,tMax){
  if(!vals.length) return '<p class="empty">Sin lecturas todavía.</p>';
  const W=300,Hh=96,pad=20, lo=Math.min(tMin-2,...vals), hi=Math.max(tMax+2,...vals);
  const x=i=>pad+(vals.length===1?(W-2*pad)/2:i*(W-2*pad)/(vals.length-1)), y=v=>Hh-12-(v-lo)/(hi-lo)*(Hh-24);
  return `<svg class="spark" viewBox="0 0 ${W} ${Hh}" role="img" aria-label="Temperaturas del viaje"><rect class="band" x="${pad}" y="${y(tMax)}" width="${W-2*pad}" height="${y(tMin)-y(tMax)}"/>
    <text x="0" y="${y(tMax)+3}">${tMax}°</text><text x="0" y="${y(tMin)+3}">${tMin}°</text><polyline class="line" points="${vals.map((v,i)=>`${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(' ')}"/>
    ${vals.map((v,i)=>`<circle class="${v<tMin||v>tMax?'pt-bad':'pt'}" cx="${x(i).toFixed(1)}" cy="${y(v).toFixed(1)}" r="3.2"/>`).join('')}</svg>`;
}
function actorLbl(a){
  if(a==='sistema') return 'Sistema (regla automática)';
  const u=S.usuarios.find(x=>x.id===a); if(!u) return a;
  if(u.inspectorId) return `${u.nombre} · ${insDe(u).legajo}`;
  if(u.empresaId) return `${u.nombre} · ${nombreEmp(u.empresaId)}`;
  return u.rol==='PACIENTE' ? 'Paciente (DNI enmascarado)' : u.nombre;
}
function ancLbl(n){
  const a=anclajeDe(n);
  if(!a) return pill('Pendiente de anclaje','warn');
  return a.estado==='CONFIRMADO' ? pill(a.id,'ok') : pill(`${a.id} · ${a.conf}/3`,'warn');
}
function tablaEventos(evs){
  if(!evs.length) return '<p class="empty">Sin eventos.</p>';
  return `<div class="tbl"><table><thead><tr><th>#</th><th>Fecha</th><th>Evento</th><th>Firmado por</th><th>Detalle</th><th>Hash</th><th>Anclaje</th></tr></thead><tbody>
    ${evs.map(b=>`<tr><td class="num">${b.n}</td><td class="num">${fmt(b.ts)}</td><td>${esc(TIPO_EVT[b.tipo]||b.tipo)}</td><td>${esc(actorLbl(b.actor))}</td><td>${esc(b.data.txt)}</td><td class="hash">${short(b.hash)}</td><td>${ancLbl(b.n)}</td></tr>`).join('')}</tbody></table></div>`;
}
function bloqPill(x){ return x ? pill('Bloqueado','crit') : ''; }

      : `<button class="btn sm" data-act="tomarEmp" data-id="${e.id}">Tomar</button>`;
    return `<div class="item warn"><span class="stripe"></span><div class="stack"><div><b>${esc(e.razon)}</b> · ${TIPO_EMP[e.tipo]} ${mio?pill('Tomada por vos','info'):pill('Sin asignar','warn')}${e.provincia!==i.provincia?' '+pill('Asignada por la Sede · '+e.provincia,'neutral'):''}</div>
      ${mio?fichaEmpresa(e):`<span class="muted">CUIT ${e.cuit} · ${esc(e.localidad)}, ${esc(e.provincia)} · solicitada ${fmt(e.solicitud)}</span>`}<div class="row">${acc}</div></div></div>`;
  };
  const cirItem=c=>{
    const mio=c.inspectorId===i.id;

}
function objetoCua(c){

/* ---------------- CIRCUITOS ---------------- */
function aceptTxt(f){ return f ? `✓ ${fmt(f)}` : 'pendiente'; }
function vCircuitos(u){
  const i=insDe(u);
  let lista=S.circuitos;
  if(u.empresaId) lista=lista.filter(c=>[c.labId,c.distId,c.farmId].includes(u.empresaId));
  if(i) lista=lista.filter(c=>emp(c.farmId).provincia===i.provincia||c.inspectorId===i.id);
  const acciones=c=>{
    if(u.empresaId && c.estado==='PENDIENTE_EMPRESAS'){
      const soy = c.distId===u.empresaId ? 'dist' : c.farmId===u.empresaId ? 'farm' : null;
      if(soy && !(soy==='dist'?c.aceptDist:c.aceptFarm)){
        if(!u.admin) return '<span class="muted">Lo acepta el admin de tu empresa</span>';
        return `<div class="row"><button class="btn sm" data-act="aceptarCir" data-id="${c.id}">Aceptar</button><input id="rce-${c.id}" placeholder="Motivo si lo rechazás"><button class="btn sm ghost" data-act="rechazarCir" data-id="${c.id}">Rechazar</button></div>`;
      }
    }
    if(i && i.provincia===emp(c.farmId).provincia){
      if(c.estado==='APROBADO') return `<button class="btn sm danger" data-act="suspenderCir" data-id="${c.id}">Suspender</button>`;
      if(c.estado==='SUSPENDIDO') return `<button class="btn sm ghost" data-act="rehabilitarCir" data-id="${c.id}">Rehabilitar</button>`;
      if(c.estado==='PENDIENTE_INSPECTOR') return `<button class="btn sm ghost" data-act="nav" data-view="bandeja">Ir a la bandeja</button>`;
    }
    return '';
  };
  const tabla = `<div class="tbl"><table><thead><tr><th>Circuito</th><th>Laboratorio → Distribuidora → Farmacia</th><th>Aceptaciones</th><th>Estado</th><th>Aprobó</th><th></th></tr></thead><tbody>
    ${lista.map(c=>{const ai=c.inspectorId?ins(c.inspectorId):null; return `<tr><td class="num"><b>${c.codigo}</b><br><span class="muted">${fmtD(c.creado)}</span></td><td>${ruta(c)}</td>
      <td class="acc"><span>Distribuidora: ${aceptTxt(c.aceptDist)}</span><span>Farmacia: ${aceptTxt(c.aceptFarm)}</span></td><td>${estPill(CIR_EST,c.estado)}${c.motivo?`<br><span class="muted">${esc(c.motivo)}</span>`:''}</td>
      <td>${ai&&c.fechaAprob?`${esc(ai.nombre)}<br><span class="muted num">${fmt(c.fechaAprob)}</span>`:ai?`<span class="muted">Revisa ${esc(ai.nombre)}</span>`:'—'}</td><td>${acciones(c)}</td></tr>`}).join('')}</tbody></table></div>`;
  let form='';
  if(u.rol==='LABORATORIO'){
    const ej=(t)=>S.empresas.filter(e=>e.tipo===t&&e.estado==='HABILITADA').map(e=>`<button type="button" class="chip" data-act="setCuit" data-campo="${t==='DISTRIBUIDOR'?'pc-dist':'pc-farm'}" data-q="${e.cuit}" title="${esc(e.razon)}">${e.cuit}</button>`).join('');
    form = `<div class="card"><h2>Proponer un circuito</h2>
      <p class="muted">Buscá por CUIT a la distribuidora y a la farmacia. Solo se aceptan empresas habilitadas del tipo correcto. Después tienen que aceptar las dos y aprobar el inspector de la provincia de la farmacia (R5).</p>
      ${u.dt?`<form class="stack" data-act="proponerCir"><div class="fields">
        <label class="f">CUIT de la distribuidora<input id="pc-dist" name="dist" required placeholder="30-…" value="${esc(S.ui.pcDist||'')}"></label>
        <label class="f">CUIT de la farmacia<input id="pc-farm" name="farm" required placeholder="30-…" value="${esc(S.ui.pcFarm||'')}"></label></div>
        <div class="row"><span class="muted">Distribuidoras:</span>${ej('DISTRIBUIDOR')}</div><div class="row"><span class="muted">Farmacias:</span>${ej('FARMACIA')}</div>
        <div class="row"><button class="btn" type="submit">Proponer circuito</button></div></form>`:'<p class="flash warn"><b>Solo el director técnico propone circuitos.</b></p>'}</div>`;
  }
  const pend = u.empresaId ? circuitosPorAceptar(u) : [];
  return `${pend.length?`<div class="flash warn"><b>Tenés ${pend.length} circuito${pend.length>1?'s':''} para aceptar.</b><span>Un circuito es un acuerdo permanente: se usa para todos los lotes que vengan.</span></div>`:''}
    <div class="card"><div class="card-head"><h2>${u.empresaId?'Circuitos de tu empresa':'Circuitos'}</h2><span class="muted">Un circuito por farmacia · permanente y reutilizable</span></div>${lista.length?tabla:'<p class="empty">Todavía no hay circuitos.</p>'}</div>${form}`;
}

/* ---------------- LABORATORIO: lotes y bultos ---------------- */
function vLotesLab(u){
  const e=emp(u.empresaId), mios=S.lotes.filter(l=>l.labId===u.empresaId).slice().reverse(), meds=S.medicamentos.filter(m=>m.labId===u.empresaId);
  const sinBulto=l=>S.unidades.filter(x=>x.loteId===l.id&&!x.bultoId).length;
  const circs=S.circuitos.filter(c=>c.labId===u.empresaId&&c.estado==='APROBADO');
  const acc=l=>{
    if(l.estado==='PENDIENTE_LIBERACION') return med(l.medId).biologico ? '<span class="muted">Lo libera un inspector de ANMAT (R4)</span>'
      : u.dt ? `<button class="btn sm" data-act="liberarDT" data-id="${l.id}">Liberar como DT</button>` : '<span class="muted">Lo libera el director técnico</span>';
    if(l.estado==='LIBERADO' && sinBulto(l)>0) return `<button class="btn sm ghost" data-act="elegirLote" data-id="${l.id}">Armar bultos</button>`;
    return '';
  };
  const sel = S.ui.loteSel && lote(S.ui.loteSel) && lote(S.ui.loteSel).estado==='LIBERADO' ? lote(S.ui.loteSel) : mios.find(l=>l.estado==='LIBERADO'&&sinBulto(l)>0);
  const bultos=S.bultos.filter(b=>lote(b.loteId).labId===u.empresaId).slice().reverse();

  return `<div class="card"><div class="card-head"><h2>Lotes de ${esc(e.razon)}</h2><span class="muted">Estado de calidad del lote; dónde está cada caja lo dicen sus bultos</span></div>
    <div class="tbl"><table><thead><tr><th>Lote</th><th>Medicamento</th><th>Cajas</th><th>Vence</th><th>Estado</th><th>Liberado por</th><th>Sin bulto</th><th></th></tr></thead><tbody>
    ${mios.map(l=>{const m=med(l.medId); return `<tr><td><b class="num">${l.codigo}</b><br><button class="chip" data-act="verTraza" data-q="${l.codigo}">Ver trazabilidad</button></td><td>${esc(m.nombre)}${m.biologico?'<br><span class="muted">biológico</span>':''}</td>
      <td class="num">${fmtN(l.cantidad)}</td><td class="num">${fmtD(l.venc)}</td><td>${estPill(LOTE_EST,l.estado)}</td><td>${liberadoTxt(l)}</td><td class="num">${fmtN(sinBulto(l))}</td><td>${acc(l)}</td></tr>`}).join('')}</tbody></table></div></div>
    ${sel?`<div class="card"><h2>Armar bultos del lote ${sel.codigo}</h2>
      <p class="muted">Cada bulto sale cerrado, con precinto y con su farmacia de destino. Solo podés usar circuitos aprobados (R6). Quedan ${fmtN(sinBulto(sel))} cajas sin bulto.</p>
      ${circs.length?`<form class="stack" data-act="armarBultos" data-lote="${sel.id}"><div class="fields">
        <label class="f">Circuito (farmacia de destino)<select name="circuito">${circs.map(c=>`<option value="${c.id}">${c.codigo} · ${esc(nombreEmp(c.farmId))} vía ${esc(nombreEmp(c.distId))}</option>`).join('')}</select></label>
        <label class="f">Cantidad de bultos<input name="n" type="number" min="1" max="10" value="1"></label>
        <label class="f">Cajas por bulto<input name="k" type="number" min="1" max="1000" value="${Math.min(200,sinBulto(sel))}"></label>
      </div><div class="row"><button class="btn" type="submit">Armar bultos</button></div></form>`:'<p class="flash warn"><b>No tenés circuitos aprobados.</b><span>Proponé uno en Circuitos.</span></p>'}</div>`:''}
    <div class="card"><div class="card-head"><h2>Bultos armados</h2><span class="muted">Se despachan en Viajes · tramo 1</span></div>
      ${bultos.length?`<div class="tbl"><table><thead><tr><th>Bulto</th><th>Lote</th><th>Cajas</th><th>Destino</th><th>Estado</th><th>Dónde está</th></tr></thead><tbody>
      ${bultos.map(b=>{const c=cir(b.circuitoId), bl=bloqueoBulto(b); return `<tr><td>${code(b.codigo)}<br><span class="muted">${b.precinto}</span></td><td class="num">${lote(b.loteId).codigo}</td><td class="num">${b.cantidad}</td><td>${esc(nombreEmp(c.farmId))}<br><span class="muted">${c.codigo} · vía ${esc(nombreEmp(c.distId))}</span></td>
        <td>${estPill(BUL_EST,b.estado)} ${bloqPill(bl)}${bl?`<br><span class="muted">${esc(bl)}</span>`:''}</td><td>${b.despachoId?`En ${via(b.despachoId).codigo}`:esc(nombreEmp(b.ubicacionId))}</td></tr>`}).join('')}</tbody></table></div>`:'<p class="empty">Todavía no armaste bultos.</p>'}</div>
    <div class="card"><h2>Registrar un lote</h2><p class="muted">Se genera una serie única por caja: GTIN + serie (R3). El lote queda pendiente de liberación.</p>
      <form class="stack" data-act="crearLote"><div class="fields">
        <label class="f">Medicamento<select name="medId">${meds.map(m=>`<option value="${m.id}">${esc(m.nombre)} · GTIN ${m.gtin}${m.biologico?' · biológico':''}</option>`).join('')}</select></label>
        <label class="f">Cajas (1 a 1.000)<input name="cantidad" type="number" min="1" max="1000" value="400"></label>
        <label class="f">Fabricación<input name="fab" type="date" value="${hoy}"></label><label class="f">Vencimiento<input name="venc" type="date" value="${venc}"></label>
      </div><div class="row"><button class="btn" type="submit">Registrar lote</button></div></form></div>`;
}
function liberadoTxt(l){
  if(!l.liberadoPor) return '—';
  if(l.liberadoPor.startsWith('ins')){ const i=ins(l.liberadoPor); return `${esc(i.nombre)}<br><span class="muted">Inspector ANMAT · ${fmt(l.fechaLib)}</span>`; }
  return `${esc(emp(l.labId).dt.replace(/ \(.*\)/,''))}<br><span class="muted">Director técnico · ${fmt(l.fechaLib)}</span>`;
}

/* ---------------- INSPECTOR: lotes y cuarentenas ---------------- */
function vLotesIns(u){
  const i=insDe(u), prov=i?i.provincia:null;

  const cuas=S.cuarentenas.filter(c=>!prov||c.provincia===prov).slice().sort((a,b)=>(a.estado==='ACTIVA'?0:1)-(b.estado==='ACTIVA'?0:1)||b.inicio.localeCompare(a.inicio));
  const accLote=l=>{
    if(l.estado==='PENDIENTE_LIBERACION') return med(l.medId).biologico?`<button class="btn sm" data-act="liberar" data-id="${l.id}">Liberar (biológico)</button>`:'<span class="muted">Lo libera el DT</span>';
    if(l.estado==='LIBERADO') return `<div class="row"><select id="cm-${l.id}"><option value="DEFECTO_CALIDAD">Defecto de calidad</option><option value="PREVENTIVA">Preventiva</option></select><input id="ct-${l.id}" placeholder="Motivo"><button class="btn sm warn" data-act="cuarentenaLote" data-id="${l.id}">Cuarentena del lote</button></div>`;
    return '';
  };
  return `<div class="card"><div class="card-head"><h2>Cuarentenas y recalls</h2><span class="muted">Tres alcances: lote, viaje o bulto · solo el inspector dictamina (R12)</span></div>
    ${cuas.length?`<div class="tbl"><table><thead><tr><th>Cuarentena</th><th>Alcance</th><th>Qué bloquea</th><th>Motivo</th><th>Estado</th><th>Dictamen</th></tr></thead><tbody>
    ${cuas.map(c=>{const rup=c.motivo==='RUPTURA_FRIO', di=c.inspectorId?ins(c.inspectorId):null;
      return `<tr class="${c.estado==='ACTIVA'?'hl':''}"><td class="num"><b>${c.id}</b><br><span class="muted">${fmt(c.inicio)}${c.automatica?' · automática':''}</span></td><td>${ALCANCE[c.alcance]}</td><td>${esc(objetoCua(c))}</td><td>${MOTIVO[c.motivo]}${c.texto?`<br><span class="muted">${esc(c.texto)}</span>`:''}</td><td>${estPill(CUA_EST,c.estado)}</td>
      <td>${c.estado==='ACTIVA'?`<div class="stack"><input id="dic-${c.id}" placeholder="Dictamen (obligatorio)"><div class="row"><button class="btn sm ghost" data-act="levantar" data-id="${c.id}" ${rup?'disabled title="R9: tras una ruptura de frío solo cabe el recall"':''}>Levantar</button><button class="btn sm danger" data-act="recall" data-id="${c.id}">Recall</button></div>${rup?'<span class="muted sub">Ruptura de frío: solo recall (R9)</span>':''}</div>`
        :`${esc(c.dictamen||'')}<br><span class="muted">${di?esc(di.nombre):''} · ${fmt(c.fin)}</span>`}</td></tr>`}).join('')}</tbody></table></div>`:'<p class="empty">No hay cuarentenas.</p>'}</div>
    <div class="card"><div class="card-head"><h2>Lotes${prov?' de laboratorios de '+esc(prov):''}</h2><span class="muted">Una cuarentena de lote bloquea todas sus cajas, estén donde estén</span></div>
    <div class="tbl"><table><thead><tr><th>Lote</th><th>Medicamento</th><th>Laboratorio</th><th>Cajas</th><th>Estado</th><th>Liberado por</th><th>Acción</th></tr></thead><tbody>
    ${lotes.map(l=>`<tr><td><b class="num">${l.codigo}</b><br><button class="chip" data-act="verTraza" data-q="${l.codigo}">Ver trazabilidad</button></td><td>${esc(med(l.medId).nombre)}</td><td>${esc(nombreEmp(l.labId))}</td><td class="num">${fmtN(l.cantidad)}</td>
      <td>${estPill(LOTE_EST,l.estado)}${vencido(l)?' '+pill('Vencido','crit'):''}</td><td>${liberadoTxt(l)}</td><td>${accLote(l)}</td></tr>`).join('')}</tbody></table></div></div>`;
}

/* ---------------- VIAJES (tramo 1 y 2) ---------------- */
function estadoEnViaje(b,v){
  const rc=S.recepciones.find(r=>r.bultoId===b.id&&r.despachoId===v.id);
  if(rc) return rc.conforme?pill('Recibido','ok'):pill('Rechazado','crit');
  if(v.estado==='PROGRAMADO') return pill('Por salir','neutral');
  if(b.estado==='ROBADO') return pill('Robado','crit');
  const bl=bloqueoBulto(b); return bl?pill('Bloqueado','crit'):pill('En camino','info');
}
const RUTAS = {1:['Planta Godoy Cruz','Acceso Sur','Ruta 7 · Maipú','Depósito Maipú'], 2:['Depósito Maipú','Acceso Sur · Luján de Cuyo','Av. San Martín · Godoy Cruz','Av. Las Heras · Ciudad','Ruta 40 · Tunuyán','Ruta 143 · San Rafael']};
function vViajes(u){
  const tramo = u.rol==='LABORATORIO'?1:2;
  const elegibles = S.bultos.filter(b=>!b.despachoId && b.ubicacionId===u.empresaId && (tramo===1?b.estado==='ARMADO':b.estado==='EN_DEPOSITO'));
  const mios = S.viajes.filter(v=>v.origenId===u.empresaId).slice().reverse();
  const opts = elegibles.map(b=>{const c=cir(b.circuitoId), bl=bloqueoBulto(b), dest=tramo===1?c.distId:c.farmId, ok=!bl&&cir(b.circuitoId).estado==='APROBADO';
    return `<label class="bopt ${ok?'':'off'}"><input type="checkbox" name="bultos" value="${b.id}" ${ok?'':'disabled'}><span>${code(b.codigo)} · ${b.cantidad} cajas de ${esc(med(lote(b.loteId).medId).nombre)} (lote ${lote(b.loteId).codigo})<br>
      <span class="muted">Destino: <b>${esc(nombreEmp(dest))}</b>${tramo===1?` · después va a ${esc(nombreEmp(c.farmId))}`:''} · ${c.codigo}${bl?` · no puede viajar: ${esc(bl)}`:c.estado!=='APROBADO'?' · circuito '+CIR_EST[c.estado][0].toLowerCase():''}</span></span></label>`;}).join('');
  const est = iso(new Date(Date.now()+4*HORA)).slice(0,16);
  const form = `<div class="card"><h2>Armar un viaje · tramo ${tramo}</h2>
    <p class="muted">${tramo===1?'Del laboratorio al depósito de la distribuidora de cada circuito.':'De tu depósito a las farmacias. Un camión puede tener varias paradas; decidís vos cómo agrupar según la distancia.'} Los bultos viajan cerrados (R7).</p>
    ${elegibles.length?`<form class="stack" data-act="crearViaje"><div class="bopts">${opts}</div><div class="fields">
      <label class="f">Patente<input name="patente" required value="${tramo===1?'AB 123 CD':'AF 992 XK'}"></label><label class="f">Chofer<input name="chofer" required value="${tramo===1?'Jorge Lucero':'Raúl Ortiz'}"></label>
      <label class="f">Llegada estimada<input name="estimada" type="datetime-local" value="${est}"></label></div>
      <div class="row"><button class="btn" type="submit">Crear viaje</button></div></form>`:`<p class="empty">No tenés bultos ${tramo===1?'armados':'en tu depósito'} para despachar.</p>`}</div>`;
  const card = v => {
    const bs=v.bultoIds.map(bul), ls=S.lecturas.filter(x=>x.despachoId===v.id), m=med(lote(bs[0].loteId).medId);
    const cua=S.cuarentenas.find(c=>c.alcance==='DESPACHO'&&c.despachoId===v.id);
    const par=paradas(v).map(id=>{const suyos=bs.filter(b=>(v.tramo===1?cir(b.circuitoId).distId:cir(b.circuitoId).farmId)===id);
      return `<div class="party"><span class="nm">${esc(nombreEmp(id))}</span>${suyos.map(b=>`<span>${code(b.codigo)} ${estadoEnViaje(b,v)}</span>`).join('')}</div>`;}).join('');
    const tr=v.estado==='EN_TRANSITO';
    return `<div class="card"><div class="card-head"><div><span class="eyebrow num">${v.codigo} · tramo ${v.tramo} · camión ${esc(v.patente)} · chofer ${esc(v.chofer)}</span><h2>${bs.length} bulto${bs.length>1?'s':''} · ${paradas(v).length} parada${paradas(v).length>1?'s':''}</h2></div>
        <div class="row">${estPill(VIA_EST,v.estado)}${cua?pill('Cuarentena del viaje','crit'):''}</div></div>
      <p class="muted">Salida ${fmt(v.salida)} · llegada estimada ${fmt(v.estimada)} · rango exigido ${m.tMin}–${m.tMax} °C</p>
      <div class="grid4">${par}</div>
      ${v.estado==='PROGRAMADO'?`<div class="row"><button class="btn" data-act="salida" data-id="${v.id}">Registrar salida del camión</button></div>`:''}
      ${ls.length||tr?`<div class="grid2"><div>${spark(ls.map(x=>x.temp),m.tMin,m.tMax)}</div><div class="tbl"><table><thead><tr><th>Hora</th><th>Lugar (GPS)</th><th>Temp.</th></tr></thead><tbody>
        ${ls.slice().reverse().map(x=>`<tr><td class="num">${fmt(x.ts)}</td><td>${esc(x.lugar)}</td><td class="num" style="color:${x.temp<m.tMin||x.temp>m.tMax?'var(--crit)':'inherit'}">${fmtT(x.temp)}</td></tr>`).join('')||'<tr><td colspan="3" class="muted">Sin lecturas</td></tr>'}</tbody></table></div></div>`:''}
      ${tr?`<div class="row"><input id="t-${v.id}" inputmode="decimal" placeholder="Temperatura del sensor (°C)"><button class="btn" data-act="lectura" data-id="${v.id}">Registrar lectura</button>
        <button class="btn ghost sm" data-act="lectura" data-id="${v.id}" data-temp="${(m.tMin+m.tMax)/2}">Lectura normal ${fmtT((m.tMin+m.tMax)/2)}</button>
        <button class="btn warn sm" data-act="lectura" data-id="${v.id}" data-temp="${m.tMax+3}">Falla de equipo ${fmtT(m.tMax+3)}</button></div>
        <div class="row"><input id="robo-${v.id}" placeholder="Si hubo robo o extravío: dónde y qué pasó"><button class="btn sm danger" data-act="robo" data-id="${v.id}">Informar robo</button></div>`:''}</div>`;
  };
  return form + (mios.length?mios.map(card).join(''):'<div class="card"><p class="empty">Todavía no creaste viajes.</p></div>');
}

/* ---------------- RECEPCIÓN (distribuidora y farmacia) ---------------- */

  const ent=bultosEntrantes(u), viajes=[...new Set(ent.map(b=>b.despachoId))].map(via);

  const otros=S.bultos.filter(b=>b.estado==='EN_TRANSITO'&&destinoEnViaje(b)!==u.empresaId).slice(0,1);
  const chips=[...ent.map(b=>b.codigo),...otros.map(b=>b.codigo),'BUL-9999'].map(c=>`<button type="button" class="chip" data-act="setBulto" data-q="${c}">${c}</button>`).join('');
  const r=S.ui.recRes, b0=S.ui.recCod?bulCod(S.ui.recCod):null, m0=b0?med(lote(b0.loteId).medId):null;
  return `<div class="card"><h2>Escanear un bulto</h2>
    <p class="muted">Escaneá el QR del bulto: solo tiene su código; el sistema busca el resto. Controlá precinto, cantidad y temperatura al abrir el camión (R8).</p>
    <form class="stack" data-act="recibir"><div class="fields">
      <label class="f">Código del bulto<input id="rc-cod" name="codigo" required value="${esc(S.ui.recCod||'')}" placeholder="BUL-0003"></label>
      <label class="f">Temperatura al abrir (°C)<input name="temp" inputmode="decimal" value="${m0?String((m0.tMin+m0.tMax)/2).replace('.',','):''}"></label>
      <label class="f">Cajas contadas<input name="cantidad" type="number" min="0" value="${b0?b0.cantidad:''}"></label>
      <label class="inline"><input type="checkbox" name="precinto" checked> Precinto intacto${b0?` (${b0.precinto})`:''}</label>
    </div><div class="row"><button class="btn" type="submit">Registrar recepción</button><span class="muted">Probá:</span>${chips}</div></form>
    ${r?`<div class="flash ${r.kind}"><b>${esc(r.title)}</b><span>${esc(r.body)}</span></div>`:''}</div>
    <div class="card"><h2>En camino hacia vos</h2>${viajes.length?viajes.map(v=>{const ls=S.lecturas.filter(x=>x.despachoId===v.id), last=ls[ls.length-1], mios=ent.filter(b=>b.despachoId===v.id);
      return `<div class="item info"><span class="stripe"></span><div class="stack"><div><b>${v.codigo} · camión ${esc(v.patente)} · chofer ${esc(v.chofer)}</b><br>
        <span class="muted">Sale de ${esc(nombreEmp(v.origenId))} · ${fmt(v.salida)} · llega aprox. ${fmt(v.estimada)} · ${paradas(v).length} parada${paradas(v).length>1?'s':''}${last?` · última lectura ${fmtT(last.temp)} en ${esc(last.lugar)}`:''}</span></div>
        <div class="tbl"><table><thead><tr><th>Bulto</th><th>Contenido</th><th>Cajas</th><th>Estado</th></tr></thead><tbody>${mios.map(b=>{const bl=bloqueoBulto(b); return `<tr><td>${code(b.codigo)}</td><td>${esc(med(lote(b.loteId).medId).nombre)} · lote ${lote(b.loteId).codigo}</td><td class="num">${b.cantidad}</td><td>${bl?pill('No recibir: bloqueado','crit')+`<br><span class="muted">${esc(bl)}</span>`:pill('Por recibir','info')}</td></tr>`}).join('')}</tbody></table></div></div></div>`;}).join(''):'<p class="empty">No hay bultos en camino hacia tu empresa.</p>'}</div>
    <div class="card"><h2>Recepciones registradas</h2>${hist.length?`<div class="tbl"><table><thead><tr><th>Fecha</th><th>Bulto</th><th>Viaje</th><th>Temp.</th><th>Precinto</th><th>Cajas</th><th>Resultado</th></tr></thead><tbody>
      ${hist.map(x=>`<tr><td class="num">${fmt(x.ts)}</td><td>${code(bul(x.bultoId).codigo)}</td><td class="num">${via(x.despachoId).codigo}</td><td class="num">${fmtT(x.temp)}</td><td>${x.precinto?'Intacto':'Roto'}</td><td class="num">${x.cantidad}</td><td>${x.conforme?pill('Recibido','ok'):pill('Rechazado','crit')}${x.motivo?`<br><span class="muted">${esc(x.motivo)}</span>`:''}</td></tr>`).join('')}</tbody></table></div>`:'<p class="empty">Sin recepciones.</p>'}</div>`;
}

/* ---------------- DEPÓSITO (distribuidora) ---------------- */
function vDeposito(u){
  const bs=S.bultos.filter(b=>b.ubicacionId===u.empresaId&&b.estado==='EN_DEPOSITO');
  const porFarm={}; bs.forEach(b=>{const f=cir(b.circuitoId).farmId; (porFarm[f]=porFarm[f]||[]).push(b);});

    ${bs.length?Object.entries(porFarm).map(([f,lst])=>`<h3>${esc(nombreEmp(f))} <span class="muted sub">· ${esc(emp(f).localidad)}</span></h3><div class="tbl"><table><thead><tr><th>Bulto</th><th>Contenido</th><th>Cajas</th><th>Circuito</th><th>Estado</th></tr></thead><tbody>
      ${lst.map(b=>{const bl=bloqueoBulto(b); return `<tr><td>${code(b.codigo)}${b.despachoId?`<br><span class="muted">asignado a ${via(b.despachoId).codigo}</span>`:''}</td><td>${esc(med(lote(b.loteId).medId).nombre)} · lote ${lote(b.loteId).codigo}</td><td class="num">${b.cantidad}</td><td class="num">${cir(b.circuitoId).codigo}</td><td>${bl?pill('Bloqueado','crit')+`<br><span class="muted">${esc(bl)}</span>`:pill('Listo para salir','ok')}</td></tr>`}).join('')}</tbody></table></div>`).join('')
    :'<p class="empty">El depósito está vacío.</p>'}<div class="row"><button class="btn ghost" data-act="nav" data-view="viajes">Armar un viaje · tramo 2</button></div></div>`;
}

/* ---------------- FARMACIA: stock y dispensación ---------------- */

  const us=S.unidades.filter(x=>x.empresaId===u.empresaId&&['EN_STOCK','DISPENSADA','DEVUELTA'].includes(x.estado));

}

/* ---------------- TRAZABILIDAD ---------------- */
function puedeVerLote(u,l){
  if(u.rol==='SEDE_CENTRAL') return true;
  if(u.rol==='INSPECTOR') return true;
  if(u.rol==='LABORATORIO') return l.labId===u.empresaId;
  return S.bultos.some(b=>b.loteId===l.id && [cir(b.circuitoId).distId,cir(b.circuitoId).farmId].includes(u.empresaId));
}
function eventosDe(f){ return S.ledger.filter(f).slice().reverse(); }
function vTraza(u){
  const q=(S.ui.trazaQ||'').trim().toUpperCase();
  const ejemplos = u.rol==='FARMACIA'||u.rol==='DISTRIBUIDOR' ? ['L2026-0398','BUL-0001','0398S000001'] : ['L2026-0415','BUL-0008','0398S000001'];
  let res='';
  if(q){
    const b=bulCod(q), un=uni(q), l=loteCod(q) || (b?lote(b.loteId):un?lote(un.loteId):null);
    if(!l) res=`<div class="card"><p class="empty">No hay ningún lote, bulto ni serie con “${esc(q)}”.</p></div>`;
    else if(!puedeVerLote(u,l)) res=`<div class="card"><p class="empty">No encontramos “${esc(q)}” entre los datos de tu empresa. (El backend responde 404: no revela que existe.)</p></div>`;
    else if(b) res=trazaBulto(u,b);
    else if(un) res=trazaSerie(u,un);
    else res=trazaLote(u,l);
  }
  return `<div class="card"><form class="stack" data-act="buscarTraza"><label class="f">Código de lote, de bulto o serie de una caja<div class="row"><input name="q" value="${esc(S.ui.trazaQ||'')}" placeholder="L2026-0415, BUL-0003 o 0398S000001"><button class="btn" type="submit">Buscar</button></div></label>
    <div class="row"><span class="muted">Ejemplos:</span>${ejemplos.map(c=>`<button type="button" class="chip" data-act="verTraza" data-q="${c}">${c}</button>`).join('')}</div></form></div>${res}`;
}
function trazaLote(u,l){
  const m=med(l.medId), bs=S.bultos.filter(b=>b.loteId===l.id), visibles=u.empresaId&&u.rol!=='LABORATORIO'?bs.filter(b=>[cir(b.circuitoId).distId,cir(b.circuitoId).farmId].includes(u.empresaId)):bs;
  const ids=new Set(visibles.map(b=>b.id));
  const evs=eventosDe(b=>b.ref.lote===l.id || (b.ref.bultos||[]).some(id=>ids.has(id)));
  return `<div class="card"><div class="card-head"><div><span class="eyebrow">Lote</span><h2>${l.codigo} · ${esc(m.nombre)}</h2><span class="muted">${esc(nombreEmp(l.labId))} · GTIN ${m.gtin} · ${fmtN(l.cantidad)} cajas · vence ${fmtD(l.venc)}</span></div>${estPill(LOTE_EST,l.estado)}</div>
    <dl class="kv"><dt>Liberado por</dt><dd>${liberadoTxt(l).replace('<br>',' · ')}</dd><dt>Rango térmico</dt><dd>${m.tMin}–${m.tMax} °C${m.biologico?' · biológico':''}</dd></dl>
    ${visibles.length?`<div class="tbl"><table><thead><tr><th>Bulto</th><th>Cajas</th><th>Farmacia de destino</th><th>Estado</th><th>Dónde está</th></tr></thead><tbody>
    ${visibles.map(b=>{const bl=bloqueoBulto(b); return `<tr><td><button class="chip" data-act="verTraza" data-q="${b.codigo}">${b.codigo}</button></td><td class="num">${b.cantidad}</td><td>${esc(nombreEmp(cir(b.circuitoId).farmId))}</td><td>${estPill(BUL_EST,b.estado)} ${bloqPill(bl)}</td><td>${b.despachoId?`En camión (${via(b.despachoId).codigo})`:esc(nombreEmp(b.ubicacionId))}</td></tr>`}).join('')}</tbody></table></div>`:'<p class="empty">Todavía no se armaron bultos.</p>'}</div>
    <div class="card wide"><h2>Eventos de la cadena</h2>${tablaEventos(evs)}</div>`;
}
function tramosBulto(b){
  return b.viajes.map(via).map(v=>{const ls=S.lecturas.filter(x=>x.despachoId===v.id), m=med(lote(b.loteId).medId), rc=S.recepciones.find(r=>r.bultoId===b.id&&r.despachoId===v.id);
    return `<div class="card"><div class="card-head"><div><span class="eyebrow">Tramo ${v.tramo} · ${v.codigo}</span><h3>${esc(nombreEmp(v.origenId))} → ${esc(nombreEmp(v.tramo===1?cir(b.circuitoId).distId:cir(b.circuitoId).farmId))}</h3>
      <span class="muted">Camión ${esc(v.patente)} · chofer ${esc(v.chofer)} · salida ${fmt(v.salida)}</span></div>${estPill(VIA_EST,v.estado)}</div>
      <div class="grid2"><div>${spark(ls.map(x=>x.temp),m.tMin,m.tMax)}</div><div>${rc?`<b>${rc.conforme?'Recibido':'Rechazado'}</b> el ${fmt(rc.ts)} a ${fmtT(rc.temp)} · precinto ${rc.precinto?'intacto':'roto'} · ${rc.cantidad} cajas${rc.motivo?`<br><span class="muted">${esc(rc.motivo)}</span>`:''}`:'<span class="muted">Todavía no llegó.</span>'}</div></div></div>`;}).join('');
}
function trazaBulto(u,b){
  const l=lote(b.loteId), c=cir(b.circuitoId), bl=bloqueoBulto(b);
  const evs=eventosDe(e=>(e.ref.bultos||[]).includes(b.id) || (e.ref.lote===l.id && ['LOTE_REGISTRADO','LOTE_LIBERADO'].includes(e.tipo)));
  return `<div class="card"><div class="card-head"><div><span class="eyebrow">Bulto</span><h2>${b.codigo} · ${b.cantidad} cajas de ${esc(med(l.medId).nombre)}</h2><span class="muted">Lote ${l.codigo} · precinto ${b.precinto} · ${c.codigo}: ${[c.labId,c.distId,c.farmId].map(nombreEmp).join(' → ')}</span></div>${estPill(BUL_EST,b.estado)}</div>
    ${bl?`<div class="flash crit"><b>Bloqueado</b><span>${esc(bl)}</span></div>`:''}</div>${tramosBulto(b)}<div class="card wide"><h2>Eventos de la cadena</h2>${tablaEventos(evs)}</div>`;
}
function trazaSerie(u,un){
  const l=lote(un.loteId), b=un.bultoId?bul(un.bultoId):null, bl=bloqueoUnidad(un);
  const evs=eventosDe(e=>e.ref.serie===un.serie || (b&&(e.ref.bultos||[]).includes(b.id)) || (e.ref.lote===l.id && ['LOTE_REGISTRADO','LOTE_LIBERADO','CUARENTENA','RECALL','CUARENTENA_LEVANTADA'].includes(e.tipo)));
  return `<div class="card"><div class="card-head"><div><span class="eyebrow">Caja</span><h2>Serie ${un.serie} · ${esc(med(l.medId).nombre)}</h2><span class="muted">Lote ${l.codigo}${b?` · bulto ${b.codigo}`:''} · está en ${esc(nombreEmp(un.empresaId))}</span></div>${estPill(UNI_EST,un.estado)}</div>
    <div class="gs1">(01)${med(l.medId).gtin}(17)${l.venc.slice(2).replace(/-/g,'')}(10)${l.codigo}(21)${un.serie}</div>${bl?`<div class="flash crit"><b>Bloqueada</b><span>${esc(bl)}</span></div>`:''}</div>
    ${b?tramosBulto(b):''}<div class="card wide"><h2>Eventos de la cadena</h2>${tablaEventos(evs)}</div>`;
}

/* ---------------- CADENA Y SEPOLIA ---------------- */
function vRegistro(){
  const ig=S.integridad, ult=S.anclajes.length?S.anclajes[S.anclajes.length-1].hasta:0, pend=S.ledger.length-ult;
  let msg;
  if(ig.ok) msg=`<div class="flash ok"><b>La cadena verifica completa.</b><span>Se recalcularon ${S.ledger.length} hashes SHA-256 y cada evento apunta al anterior. Los ${S.sepolia.length} hashes anclados en Sepolia coinciden. Última verificación: ${fmt(ig.verificado)}.</span></div>`;
  else if(ig.interna) msg=`<div class="flash crit"><b>El evento #${ig.interna} no coincide con su hash.</b><span>Alguien cambió un dato guardado sin pasar por la aplicación. Todo lo posterior queda sin respaldo.</span></div>`;
  else msg=`<div class="flash crit"><b>La base es coherente, pero no coincide con Sepolia.</b><span>El hash del evento #${ig.sepolia.numero} anclado el ${fmt(ig.sepolia.ts)} (bloque ${ig.sepolia.bloque}) es distinto del que resulta hoy. Alguien reescribió la base y recalculó los hashes; la blockchain lo delata. La alteración está entre los eventos #${(S.anclajes.find(a=>a.hasta===ig.sepolia.numero)||{desde:1}).desde} y #${ig.sepolia.numero}.</span></div>`;
  const show=S.ui.verTodo?S.ledger:S.ledger.slice(-25);
  return `<div class="card"><div class="card-head"><div><h2>Verificación</h2><p class="muted">Se hace en dos pasos: coherencia interna de la base y comparación contra lo anclado en Sepolia (R15).</p></div>
      <div class="row"><button class="btn" data-act="verificarCadena">Verificar ahora</button></div></div>${msg}
    <div class="row">${S.tamper?`<button class="btn ghost" data-act="restaurar">Restaurar la base original</button><span class="muted">${esc(S.tamper.desc)}</span>`
      :`<button class="btn warn" data-act="tamper">Alterar un evento en la base</button><button class="btn danger" data-act="tamperAvanzado">Reescribir la base y recalcular hashes</button>`}</div></div>
    <div class="split"><div class="card"><h2>Próxima tanda</h2><p class="verdict cd" id="cd">—</p><p class="muted">${pend?`${pend} evento${pend>1?'s':''} esperando anclaje.`:'Todos los eventos están anclados.'} Cada 5 minutos, si hubo eventos nuevos, el último hash va a Sepolia en una sola transacción.</p>
      <div class="row"><button class="btn ghost" data-act="anclarAhora" ${pend?'':'disabled'}>Anclar ahora</button></div></div>
      <div class="card"><h2>Qué va a la blockchain</h2><p class="muted">Solo el hash del último evento y su número: <span class="code">anclar(bytes32 hash, uint64 hastaNumero)</span>. Nunca datos de pacientes ni de empresas. En este prototipo la transacción se simula; en el backend la envía Web3j al contrato MediChainAnchor.</p></div></div>
    <div class="card"><div class="card-head"><h2>Anclajes en Sepolia</h2><span class="muted">Simulados · ${S.anclajes.length} tandas</span></div>
      <div class="tbl"><table><thead><tr><th>Anclaje</th><th>Eventos</th><th>Hash anclado</th><th>Transacción</th><th>Bloque</th><th>Fecha</th><th>Estado</th></tr></thead><tbody>
      ${S.anclajes.slice().reverse().slice(0,12).map(a=>`<tr><td class="num"><b>${a.id}</b></td><td class="num">#${a.desde} a #${a.hasta}</td><td class="hash">${short(a.hash)}</td><td class="hash">${short(a.tx)}</td><td class="num">${fmtN(a.bloque)}</td><td class="num">${fmt(a.ts)}</td><td>${a.estado==='CONFIRMADO'?pill('Confirmado','ok'):pill(`${a.conf}/3 confirmaciones`,'warn')}</td></tr>`).join('')}</tbody></table></div></div>
    <div class="card wide"><div class="card-head"><h2>Cadena de eventos</h2><button class="btn sm ghost" data-act="verTodo">${S.ui.verTodo?'Ver los últimos 25':'Ver los '+S.ledger.length}</button></div>
      <div class="tbl"><table><thead><tr><th>#</th><th>Fecha</th><th>Evento</th><th>Firmado por</th><th>Detalle</th><th>Hash anterior</th><th>Hash</th><th>Anclaje</th></tr></thead><tbody>
      ${show.slice().reverse().map(b=>{const bad=!ig.ok&&ig.interna&&b.n===ig.interna; return `<tr class="${bad?'bad':''}"><td class="num">${b.n}</td><td class="num">${fmt(b.ts)}</td><td>${esc(TIPO_EVT[b.tipo]||b.tipo)}</td><td>${esc(actorLbl(b.actor))}</td><td>${esc(b.data.txt)}</td><td class="hash">${short(b.prev)}</td><td class="hash">${short(b.hash)}</td><td>${ancLbl(b.n)}</td></tr>`}).join('')}</tbody></table></div></div>`;
}

/* ---------------- VERIFICACIÓN PÚBLICA Y PACIENTE ---------------- */
function resultado(q,u){
  const un=uni(q);
  if(!un) return {kind:'crit',verdict:'No encontramos este número de serie',checks:[['crit','No figura en el registro de ningún laboratorio habilitado','Puede ser una falsificación. No lo consumas y reportalo.']],serie:q,existe:false};
  const l=lote(un.loteId), m=med(l.medId), d=S.dispensaciones.find(x=>x.serie===un.serie&&!x.anulada), bl=bloqueoUnidad(un);
  const checks=[['ok','Auténtico',`Registrado por ${nombreEmp(l.labId)}, laboratorio habilitado por ANMAT.`]];
  checks.push(vencido(l)?['crit','Vencido',`Venció el ${fmtD(l.venc)}.`]:['ok','Vigente',`Vence el ${fmtD(l.venc)}.`]);
  const c=un.bultoId?cuaDeBulto(bul(un.bultoId)):cuaVigentes().find(c=>c.alcance==='LOTE'&&c.loteId===l.id);
  if(c&&c.estado==='CONVERTIDA_EN_RECALL') checks.push(['crit','No consumir: producto retirado del mercado','ANMAT ordenó el retiro. Devolvelo en la farmacia.']);
  else if(c) checks.push(['crit','Bajo investigación','ANMAT puso este producto en cuarentena. No lo uses hasta nuevo aviso.']);
  else if(!vencido(l)) checks.push(['ok','Sin alertas sanitarias','No hay cuarentena ni recall sobre esta caja.']);
  if(un.estado==='ROBADA') checks.push(['crit','Informado como robado','Esta caja figura en un robo durante el transporte. No la uses y reportala.']);
  else if(un.estado==='DEVUELTA') checks.push(['warn','Devuelta por la farmacia','No debería estar en manos de un paciente. Si la compraste, reportala.']);
  else if(d) checks.push(['ok',u&&d.dni===u.dni?'Dispensada a vos':'Ya fue dispensada',`${nombreEmp(d.farmId)}, el ${fmt(d.ts)}`]);
  else if(un.estado==='EN_STOCK') checks.push(['warn','Todavía no fue vendida',`Figura en el stock de ${nombreEmp(un.empresaId)}. Si la tenés en tu casa, reportala.`]);
  else checks.push(['warn','Todavía no llegó a una farmacia','Si la compraste, es una irregularidad: reportala.']);
  // recorrido mínimo (sin distribuidora, temperaturas ni datos de pacientes: R13)
  const rec=[[`Fabricada por ${nombreEmp(l.labId)}`,l.creado],[`Lote liberado ${l.liberadoPor&&l.liberadoPor.startsWith('ins')?'por ANMAT':'por el director técnico'}`,l.fechaLib]];
  const rc=S.recepciones.filter(r=>r.bultoId===un.bultoId&&r.conforme&&emp(r.empresaId).tipo==='FARMACIA')[0]; if(rc) rec.push([`Recibida en ${nombreEmp(rc.empresaId)}`,rc.ts]);
  if(d) rec.push([`Dispensada en ${nombreEmp(d.farmId)}`,d.ts]);
  const rel=S.ledger.filter(e=>e.ref.serie===un.serie||(e.ref.lote===l.id&&!e.ref.serie)||(un.bultoId&&(e.ref.bultos||[]).includes(un.bultoId)));
  const anclados=rel.filter(e=>anclajeDe(e.n)), a=anclados.length?anclajeDe(anclados[anclados.length-1].n):null, pend=rel.length-anclados.length;
  const extra = pend ? ` · ${pend} evento${pend>1?'s':''} más reciente${pend>1?'s':''} se ancla${pend>1?'n':''} en la próxima tanda` : '';
  const anc = !S.integridad.ok ? ['warn','Registro en revisión','La verificación de la cadena encontró una inconsistencia.']
    : a ? ['ok','Registro verificado',`Anclado en Sepolia el ${fmt(a.ts)} · bloque ${fmtN(a.bloque)} · tx ${short(a.tx)}${extra}`]
    : ['warn','Registro verificado · pendiente de anclaje','Se ancla en Sepolia en la próxima tanda (cada 5 minutos).'];
  const bad=checks.some(x=>x[0]==='crit'), warn=checks.some(x=>x[0]==='warn');
  return {kind:bad?'crit':warn?'warn':'ok',verdict:bad?'No lo consumas':warn?'Revisá este medicamento':'Podés usarlo con tranquilidad',med:m,checks,rec:rec.filter(x=>x[1]),anc,serie:un.serie,existe:true};
}
function vVerificar(u){
  const q=S.ui.pacQ||'', r=q?resultado(q,u):null;
  return `<div class="card"><h2>¿Es original mi medicamento?</h2><p class="muted">Escaneá el DataMatrix de la caja o escribí el número de serie. No hace falta cuenta.</p>
    <form class="stack" data-act="verificarSerie"><div class="row"><input name="q" value="${esc(q)}" placeholder="Ej.: 0398S000001"><button class="btn" type="submit">Verificar</button></div>
    <div class="row"><span class="muted">Ejemplos:</span>${['0398S000001','0398S000150','0412S000010','9999S000001'].map(s=>`<button type="button" class="chip" data-act="pacSerie" data-q="${s}">${s}</button>`).join('')}</div></form></div>
    ${r?`<div class="card"><div class="card-head"><div><span class="eyebrow num">Serie ${esc(r.serie)}</span>${r.med?`<h2>${esc(r.med.nombre)}</h2><span class="muted">${esc(r.med.presentacion)}</span>`:''}</div></div>
      <div class="verdict ${r.kind}">${esc(r.verdict)}</div>
      <ul class="checks">${r.checks.map(([k,t,d])=>`<li><span class="mark ${k}">${k==='ok'?'✓':k==='warn'?'!':'✕'}</span><span><b>${esc(t)}</b><br><span class="muted">${esc(d)}</span></span></li>`).join('')}</ul>
      ${r.existe?`<h3>Recorrido</h3><ul class="checks">${r.rec.map(([t,f])=>`<li><span class="mark ok">✓</span><span>${esc(t)}<br><span class="muted">${fmt(f)}</span></span></li>`).join('')}</ul>
      <div class="flash ${r.anc[0]}"><b>${esc(r.anc[1])}</b><span>${esc(r.anc[2])}</span></div>`:''}
      <p class="muted">No mostramos distribuidora, temperaturas ni datos de pacientes (R13).</p></div>
      ${u&&u.rol==='PACIENTE'?`<div class="card"><h2>Reportar un problema con esta caja</h2><form class="stack" data-act="reportar" data-serie="${esc(r.serie)}"><div class="fields">
        <label class="f">Motivo<select name="motivo"><option>Malestar o efecto adverso</option><option>Envase dañado o adulterado</option><option>Sospecha de falsificación</option><option>Otro</option></select></label></div>
        <label class="f">Qué pasó<textarea name="desc" required>El envase tenía el precinto abierto.</textarea></label>
        <div class="row"><button class="btn" type="submit">Enviar a ANMAT</button><span class="muted">Lo recibe un inspector de la provincia.</span></div></form></div>`:''}`:''}`;
}
function vMisMeds(u){
  const mis=S.dispensaciones.filter(d=>d.dni===u.dni&&!d.anulada).slice().reverse(), reps=S.reportes.filter(r=>r.dni===u.dni).slice().reverse();
  return `<div class="card"><h2>Medicamentos dispensados a tu DNI</h2>${mis.length?`<div class="tbl"><table><thead><tr><th>Fecha</th><th>Medicamento</th><th>Serie</th><th>Farmacia</th><th>Estado</th><th></th></tr></thead><tbody>
    ${mis.map(d=>{const un=uni(d.serie), l=lote(un.loteId), bl=bloqueoUnidad(un); return `<tr><td class="num">${fmt(d.ts)}</td><td>${esc(med(l.medId).nombre)}</td><td class="num">${d.serie}</td><td>${esc(nombreEmp(d.farmId))}</td><td>${bl?pill('No usar','crit'):pill('Sin alertas','ok')}</td><td><button class="btn sm ghost" data-act="pacSerie" data-q="${d.serie}">Verificar</button></td></tr>`}).join('')}</tbody></table></div>`:'<p class="empty">No hay dispensaciones a tu nombre.</p>'}</div>
    <div class="card"><h2>Tus reportes</h2>${reps.length?reps.map(r=>`<div class="item ${r.estado==='CERRADO'?'ok':'warn'}"><span class="stripe"></span><div><b class="num">${r.id} · ${esc(r.motivo)}</b><br><span class="muted">Serie ${esc(r.serie)} · ${fmt(r.ts)} · ${r.estado==='CERRADO'?'Cerrado: '+esc(r.conclusion):r.estado==='EN_INVESTIGACION'?'Un inspector lo está investigando':'Recibido por ANMAT'}</span></div></div>`).join(''):'<p class="empty">No enviaste reportes.</p>'}</div>`;
}
